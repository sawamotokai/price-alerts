<style>
:root{font-family:Inter,ui-sans-serif,system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;color:#0f172a;background:#f8fafc;line-height:1.45;--bg:#f8fafc;--card:#fff;--line:#e2e8f0;--muted:#64748b;--accent:#2563eb;--accent-soft:#eff6ff;--radius:16px}*{box-sizing:border-box}html{background:var(--bg)}body{margin:0;background:var(--bg);min-height:100vh}body.sheet-open{overflow:hidden}button,input,select{font:inherit}.wrap{max-width:1500px;margin:0 auto;padding:24px}.top{display:flex;justify-content:space-between;align-items:flex-end;gap:18px}.title{margin:0;font-size:clamp(24px,3vw,36px);letter-spacing:-.035em}.muted{color:var(--muted)}.updated{font-size:13px;text-align:right}.status{padding:11px 14px;border-radius:12px;background:var(--accent-soft);color:#1d4ed8;font-size:13px;margin-top:14px;border:1px solid #dbeafe}.status.error{background:#fef2f2;color:#991b1b;border-color:#fecaca}.metrics{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:12px;margin-top:16px}.metric{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:14px 16px}.metric-label{font-size:12px;color:var(--muted)}.metric-value{font-weight:800;font-size:22px;margin-top:2px;letter-spacing:-.02em}.card{background:var(--card);border:1px solid var(--line);border-radius:var(--radius);box-shadow:0 1px 2px rgba(15,23,42,.04)}
.market-card{margin-top:16px;padding:16px}.market-head{display:flex;justify-content:space-between;align-items:flex-start;gap:12px}.market-title{margin:0;font-size:18px}.market-controls{display:flex;gap:8px;flex-wrap:wrap}.market-chart-wrap{position:relative;margin-top:12px;border:1px solid var(--line);border-radius:12px;overflow:hidden;background:#fff}.market-canvas{display:block;width:100%;height:430px;touch-action:none}.market-tooltip{position:absolute;pointer-events:none;z-index:3;display:none;max-width:280px;padding:8px 10px;border-radius:9px;background:rgba(15,23,42,.94);color:#fff;font-size:12px;box-shadow:0 8px 30px rgba(15,23,42,.2)}.market-note{display:flex;justify-content:space-between;gap:10px;flex-wrap:wrap;margin-top:8px;font-size:12px;color:var(--muted)}.drops-card{margin-top:16px;padding:16px;border-color:#fed7aa;background:linear-gradient(135deg,#fff 0%,#fffaf5 100%)}.drops-head{display:flex;justify-content:space-between;align-items:flex-start;gap:12px}.drops-title{margin:0;font-size:18px}.drops-count{display:inline-flex;align-items:center;padding:5px 9px;border-radius:999px;background:#fff7ed;color:#c2410c;border:1px solid #fed7aa;font-size:12px;font-weight:800}.drops-grid{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:10px;margin-top:12px}.drop-card{position:relative;border:1px solid #fed7aa;border-radius:14px;background:#fff;padding:13px;cursor:pointer;min-width:0}.drop-card:hover{box-shadow:0 8px 24px rgba(194,65,12,.08);transform:translateY(-1px)}.drop-rank{position:absolute;top:10px;right:10px;color:#c2410c;font-size:11px;font-weight:900}.drop-title{font-size:13px;font-weight:800;padding-right:30px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.drop-address{font-size:11px;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;margin-top:3px}.drop-prices{display:flex;align-items:center;gap:7px;flex-wrap:wrap;margin-top:11px}.drop-old{color:#94a3b8;text-decoration:line-through;font-size:12px}.drop-arrow{color:#fb923c;font-weight:900}.drop-new{font-size:16px;font-weight:900}.drop-change{margin-top:7px;color:#c2410c;font-size:13px;font-weight:900}.drop-meta{display:flex;justify-content:space-between;align-items:center;gap:8px;margin-top:10px}.drops-empty{grid-column:1/-1;padding:20px 0 4px;text-align:center;color:#94a3b8;font-size:13px}
.grid{display:grid;grid-template-columns:minmax(0,1.75fr) minmax(360px,1fr);gap:20px;margin-top:20px;align-items:start}.filters{padding:14px;display:grid;grid-template-columns:minmax(220px,1.6fr) repeat(3,minmax(130px,.7fr));gap:8px;border-bottom:1px solid var(--line)}.control{width:100%;min-width:0;border:1px solid #cbd5e1;border-radius:10px;padding:10px 11px;background:#fff;color:#0f172a;outline:none}.control:focus{border-color:#60a5fa;box-shadow:0 0 0 3px rgba(59,130,246,.12)}.tablewrap{overflow:auto;max-height:calc(100vh - 265px)}table{width:100%;border-collapse:collapse;min-width:1030px}th,td{padding:11px 12px;border-top:1px solid #f1f5f9;text-align:left;font-size:13px;vertical-align:top}th{position:sticky;top:0;background:#f8fafc;z-index:2;color:#475569;white-space:nowrap}tbody tr{cursor:pointer}tbody tr:hover,tbody tr[aria-selected="true"]{background:#f8fafc}.name-cell{min-width:220px}.price{font-weight:800;white-space:nowrap}.badge{display:inline-flex;align-items:center;padding:3px 7px;border-radius:999px;background:#f1f5f9;font-size:11px;white-space:nowrap}.badge.fudousan{background:#fef3c7;color:#92400e}.open-btn{display:inline-flex;align-items:center;justify-content:center;min-height:34px;padding:7px 10px;border-radius:9px;background:#eff6ff;color:#1d4ed8;text-decoration:none;font-weight:700;border:1px solid #dbeafe;white-space:nowrap}.mobile-list{display:none;padding:10px}.property-card{border:1px solid var(--line);border-radius:14px;padding:14px;background:#fff;margin-bottom:10px;cursor:pointer}.property-card:active{background:#f8fafc}.property-card-head{display:flex;align-items:flex-start;justify-content:space-between;gap:10px}.property-title{font-weight:750;font-size:15px;min-width:0}.property-price{font-weight:850;white-space:nowrap;font-size:16px}.property-address{font-size:12px;color:var(--muted);margin-top:4px}.property-facts{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:6px 10px;margin-top:11px;font-size:12px}.property-actions{display:flex;justify-content:space-between;align-items:center;gap:8px;margin-top:12px}.load-more{display:none;width:calc(100% - 20px);margin:0 10px 12px;padding:11px;border:1px solid #cbd5e1;border-radius:11px;background:#fff;font-weight:750;color:#334155}.detail{padding:18px;position:sticky;top:18px;max-height:calc(100vh - 36px);overflow:auto}.detail h2{margin:0 0 4px;font-size:20px;letter-spacing:-.02em}.detail-head{display:flex;justify-content:space-between;gap:12px;align-items:flex-start}.detail-close{display:none;border:0;background:#f1f5f9;border-radius:999px;width:36px;height:36px;font-size:22px;line-height:1;cursor:pointer}.kv{display:grid;grid-template-columns:112px minmax(0,1fr);gap:8px;font-size:13px;margin:16px 0}.kv>div:nth-child(odd){color:var(--muted)}.chart-wrap{overflow:hidden;border:1px solid var(--line);border-radius:12px;background:#fff}.chart{display:block;width:100%;height:auto;min-height:280px}.legend{display:flex;gap:10px;flex-wrap:wrap;font-size:12px;margin-top:8px}.empty{padding:42px 20px;text-align:center;color:#94a3b8}.sheet-backdrop{display:none}
@media(max-width:1100px){.drops-grid{grid-template-columns:repeat(2,minmax(0,1fr))}.metrics{grid-template-columns:repeat(2,minmax(0,1fr))}.grid{grid-template-columns:1fr}.detail{position:static;max-height:none}.tablewrap{max-height:none}}
@media(max-width:760px){.wrap{padding:14px 12px calc(24px + env(safe-area-inset-bottom))}.top{align-items:flex-start;flex-direction:column;gap:7px}.updated{text-align:left}.status{margin-top:12px}.metrics{grid-template-columns:repeat(2,minmax(0,1fr));gap:8px;margin-top:10px}.metric{padding:11px 12px}.metric-value{font-size:18px}.drops-card{padding:12px;margin-top:10px}.drops-head{align-items:center}.drops-grid{display:flex;overflow-x:auto;scroll-snap-type:x mandatory;gap:9px;padding-bottom:3px}.drop-card{flex:0 0 min(82vw,320px);scroll-snap-align:start}.market-card{padding:12px;margin-top:10px}.market-head{display:block}.market-controls{margin-top:10px}.market-canvas{height:315px}.market-note{display:block}.grid{display:block;margin-top:12px}.filters{position:sticky;top:0;z-index:4;grid-template-columns:1fr 1fr;padding:10px;background:rgba(255,255,255,.97);backdrop-filter:blur(10px)}.filters #q{grid-column:1/-1}.tablewrap{display:none}.mobile-list{display:block}.load-more{display:block}.detail{position:fixed;left:0;right:0;bottom:0;top:auto;z-index:20;max-height:min(88vh,820px);overflow:auto;border-radius:22px 22px 0 0;padding:18px 16px calc(18px + env(safe-area-inset-bottom));transform:translateY(105%);transition:transform .2s ease;box-shadow:0 -18px 60px rgba(15,23,42,.22)}.detail.open{transform:translateY(0)}.detail-close{display:inline-grid;place-items:center}.sheet-backdrop{display:block;position:fixed;inset:0;z-index:19;background:rgba(15,23,42,.42);opacity:0;pointer-events:none;transition:opacity .2s ease}.sheet-backdrop.open{opacity:1;pointer-events:auto}.chart{min-height:230px}.kv{grid-template-columns:96px minmax(0,1fr)}}
@media(max-width:420px){.filters{grid-template-columns:1fr}.filters #q{grid-column:auto}.metrics{grid-template-columns:1fr 1fr}.property-card-head{display:block}.property-price{margin-top:6px}.property-facts{grid-template-columns:1fr}.title{font-size:26px}.market-controls .control{flex:1 1 100%}}
@media(prefers-reduced-motion:reduce){.detail,.sheet-backdrop{transition:none}}
</style></head><body>
<div class="wrap"><header class="top"><div><h1 class="title">中古戸建 Price Watch</h1><div class="muted">品川区・目黒区 / 所有権の土地・土地建物のみ / 夜間バッチ収集</div></div><div id="updated" class="updated muted"></div></header><div id="status" class="status" role="status">データ読込中…</div>
<section class="metrics"><div class="metric"><div class="metric-label">表示中</div><div id="metricShown" class="metric-value">—</div></div><div class="metric"><div class="metric-label">掲載レコード</div><div id="metricTotal" class="metric-value">—</div></div><div class="metric"><div class="metric-label">価格取得率</div><div id="metricCoverage" class="metric-value">—</div></div><div class="metric"><div class="metric-label">価格変更</div><div id="metricChanged" class="metric-value">—</div></div></section><section class="card drops-card" aria-label="値下げ物件"><div class="drops-head"><div><h2 class="drops-title">値下げされた物件</h2><div class="muted" style="font-size:12px;margin-top:3px">初回観測価格から下落した掲載を、下落率・下落額の大きい順に表示</div></div><span id="dropsCount" class="drops-count">—</span></div><div id="dropsGrid" class="drops-grid"><div class="drops-empty">価格履歴を確認中…</div></div></section>
<section class="card market-card" aria-label="全物件価格推移"><div class="market-head"><div><h2 class="market-title">全物件の掲載価格推移</h2><div class="muted" style="font-size:12px;margin-top:3px">1本の線 = 1掲載物件。下の検索・区・ソースの絞り込みと連動します。</div></div><div class="market-controls"><select id="marketScale" class="control" aria-label="価格軸"><option value="linear">価格軸：線形</option><option value="log">価格軸：対数</option></select></div></div><div class="market-chart-wrap"><canvas id="marketCanvas" class="market-canvas"></canvas><div id="marketTooltip" class="market-tooltip"></div></div><div class="market-note"><span id="marketCount">—</span><span>線に触れると物件名・日付・価格を表示</span></div></section>
<main class="grid"><section class="card"><div class="filters"><input class="control" id="q" type="search" inputmode="search" placeholder="住所・駅・物件名で検索"/><select class="control" id="ward"><option value="">全区</option><option>品川区</option><option>目黒区</option></select><select class="control" id="source"><option value="">全ソース</option></select><select class="control" id="sort"><option value="priceAsc">価格が安い順</option><option value="priceDesc">価格が高い順</option><option value="daysDesc">掲載日数が長い順</option><option value="newest">新着順</option></select></div><div class="tablewrap"><table><thead><tr><th>区</th><th>物件</th><th>価格</th><th>土地</th><th>建物</th><th>築年</th><th>駅</th><th>日数</th><th>ソース</th><th>リンク</th></tr></thead><tbody id="rows"></tbody></table></div><div id="mobileList" class="mobile-list"></div><button id="loadMore" class="load-more" type="button">さらに表示</button></section><aside class="card detail" id="detail"><div class="empty">物件を選択すると価格推移を表示します</div></aside></main></div><div id="sheetBackdrop" class="sheet-backdrop"></div>
<script>
'use strict';
const DATA_URL='https://raw.githubusercontent.com/sawamotokai/price-alerts/master/realestate/data/dashboard.json';const PAGE_SIZE=50;let items=[],visibleLimit=PAGE_SIZE,selectedId=null,marketGeometry=[];const $=id=>document.getElementById(id);const isMobile=()=>matchMedia('(max-width:760px)').matches;
function esc(s){return String(s??'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]))}const NON_FREEHOLD_RE=/(?:借地権|定期借地|普通借地|旧法借地|新法借地|地上権|賃借権|借地期間|借地料|地代)/;function isNonFreehold(x){let explicit=[x.land_right_status,x.land_rights,x.land_right,x.land_ownership,x.ownership,x.tenure,x.rights,x.property_rights,x['土地権利'],x['権利形態']].filter(Boolean).join(' '),fallback=[x.title,x.address,x.description,x.remarks,x.notes].filter(Boolean).join(' ');return String(x.land_right_status||'').toLowerCase()==='leasehold'||NON_FREEHOLD_RE.test(explicit+' '+fallback)}function sourceLabel(s){let v=String(s||'').toLowerCase();if(v==='suumo')return'SUUMO';if(v==='homes')return"HOME'S";if(v.includes('fudousan'))return'不動産ジャパン';return s||'—'}function sourceClass(s){return String(s||'').toLowerCase().includes('fudousan')?'badge fudousan':'badge'}function yen(v){return v==null?'—':Math.round(Number(v)/10000).toLocaleString('ja-JP')+'万円'}function area(v){return v==null?'—':Number(v).toLocaleString('ja-JP',{maximumFractionDigits:2})+'㎡'}function dateOnly(v){return v?String(v).slice(0,10):'—'}
function normalize(r){return{...r,id:r.listing_id||r.id,propertyId:r.property_id||r.listing_id||r.id,source:String(r.source||''),priceYen:r.price_yen==null?null:Number(r.price_yen),land:r.land_area_sqm??r.land_sqm??null,building:r.building_area_sqm??r.building_sqm??null,built:r.built_year_month??r.built??null,station:r.access??r.station??null,days:Number(r.observed_days??r.listing_days??0),firstSeen:r.first_seen??null,history:Array.isArray(r.price_history)?r.price_history:[]}}
function priceHistory(x){let m=new Map();for(let p of x.history||[]){if(Array.isArray(p)&&p[0]&&p[1]!=null)m.set(String(p[0]),Number(p[1]));else if(p&&p.date&&(p.price_yen??p.price)!=null)m.set(String(p.date),Number(p.price_yen??p.price))}return[...m.entries()].filter(([,v])=>Number.isFinite(v)&&v>0).sort((a,b)=>a[0].localeCompare(b[0]))}
function priceDrop(x){let h=priceHistory(x),current=x.priceYen;if(h.length){let first=h[0][1],latest=current??h.at(-1)[1],amount=first-latest;if(amount>0)return{first,current:latest,amount,pct:amount/first*100,date:h.at(-1)[0]}}let raw=Number(x.price_change_yen||0);if(raw<0&&current!=null){let first=current-raw,amount=-raw;return{first,current,amount,pct:amount/first*100,date:dateOnly(x.last_seen)}}return null}
function renderPriceDrops(){let drops=items.map(x=>({x,d:priceDrop(x)})).filter(v=>v.d).sort((a,b)=>b.d.pct-a.d.pct||b.d.amount-a.d.amount);$('dropsCount').textContent=drops.length.toLocaleString('ja-JP')+'件';let top=drops.slice(0,12);$('dropsGrid').innerHTML=top.length?top.map(({x,d},i)=>`<article class="drop-card" data-drop-id="${esc(x.id)}" tabindex="0"><span class="drop-rank">#${i+1}</span><div class="drop-title">${esc(x.title||x.address||x.id)}</div><div class="drop-address">${esc(x.address||'')}</div><div class="drop-prices"><span class="drop-old">${yen(d.first)}</span><span class="drop-arrow">→</span><span class="drop-new">${yen(d.current)}</span></div><div class="drop-change">▼ ${yen(d.amount)}（${d.pct.toFixed(1)}%）</div><div class="drop-meta"><span class="${sourceClass(x.source)}">${esc(sourceLabel(x.source))}</span>${linkHtml(x,'物件を見る')}</div></article>`).join(''):`<div class="drops-empty">観測開始後、値下げが確認された物件はまだありません。</div>`;document.querySelectorAll('[data-drop-id]').forEach(el=>el.onclick=e=>{if(e.target.closest('a'))return;show(el.dataset.dropId)})}
function filtered(){let a=[...items],q=$('q').value.trim().toLowerCase(),w=$('ward').value,s=$('source').value;if(q)a=a.filter(x=>[x.title,x.address,x.station,x.layout,x.broker].some(v=>String(v||'').toLowerCase().includes(q)));if(w)a=a.filter(x=>x.ward===w);if(s)a=a.filter(x=>x.source===s);let m=$('sort').value;a.sort((x,y)=>m==='priceDesc'?(y.priceYen||0)-(x.priceYen||0):m==='daysDesc'?y.days-x.days:m==='newest'?String(y.firstSeen||'').localeCompare(String(x.firstSeen||'')):(x.priceYen??Number.MAX_SAFE_INTEGER)-(y.priceYen??Number.MAX_SAFE_INTEGER));return a}
function linkHtml(x,label='物件を開く'){return x.url?`<a class="open-btn" href="${esc(x.url)}" target="_blank" rel="noopener noreferrer" onclick="event.stopPropagation()">${label}</a>`:'<span class="muted">リンクなし</span>'}
function render(){let a=filtered(),shown=isMobile()?a.slice(0,visibleLimit):a;$('rows').innerHTML=a.map(x=>`<tr data-id="${esc(x.id)}"><td>${esc(x.ward||'—')}</td><td class="name-cell"><b>${esc(x.title||x.address||x.id)}</b><div class="muted">${esc(x.address||'')}</div></td><td class="price">${yen(x.priceYen)}</td><td>${area(x.land)}</td><td>${area(x.building)}</td><td>${esc(x.built||'—')}</td><td>${esc(x.station||'—')}</td><td>${x.days}日</td><td><span class="${sourceClass(x.source)}">${esc(sourceLabel(x.source))}</span></td><td>${linkHtml(x,'開く')}</td></tr>`).join('');$('mobileList').innerHTML=shown.map(x=>`<article class="property-card" data-id="${esc(x.id)}" tabindex="0"><div class="property-card-head"><div class="property-title">${esc(x.title||x.address||x.id)}</div><div class="property-price">${yen(x.priceYen)}</div></div><div class="property-address">${esc(x.address||'')}</div><div class="property-facts"><span>土地 ${area(x.land)}</span><span>建物 ${area(x.building)}</span><span>${esc(x.station||'駅情報なし')}</span><span>${x.days}日 · ${esc(sourceLabel(x.source))}</span></div><div class="property-actions"><span class="${sourceClass(x.source)}">${esc(sourceLabel(x.source))}</span>${linkHtml(x)}</div></article>`).join('');document.querySelectorAll('[data-id]').forEach(el=>{if(el.tagName==='A')return;el.onclick=e=>{if(e.target.closest('a'))return;show(el.dataset.id)}});$('loadMore').style.display=isMobile()&&shown.length<a.length?'block':'none';$('metricShown').textContent=a.length.toLocaleString('ja-JP');$('metricTotal').textContent=items.length.toLocaleString('ja-JP');let priced=items.filter(x=>x.priceYen!=null).length;$('metricCoverage').textContent=items.length?Math.round(priced/items.length*100)+'%':'—';$('status').textContent=`${a.length.toLocaleString()}件表示 / ${items.length.toLocaleString()}件取得済み。所有権の土地・土地建物のみ。表示時スクレイピングなし。`;renderPriceDrops();drawMarketChart(a)}
function closeSheet(){$('detail').classList.remove('open');$('sheetBackdrop').classList.remove('open');document.body.classList.remove('sheet-open')}
function show(id){let x=items.find(v=>v.id===id);if(!x)return;selectedId=id;let h=x.history.filter(p=>Array.isArray(p)&&p[1]!=null);$('detail').innerHTML=`<div class="detail-head"><div><h2>${esc(x.title||x.address||x.id)}</h2><div class="muted">${esc(x.address||'')}</div></div><button class="detail-close" onclick="closeSheet()">×</button></div><div class="kv"><div>現在価格</div><b>${yen(x.priceYen)}</b><div>観測開始</div><div>${dateOnly(x.firstSeen)}</div><div>掲載日数</div><div>${x.days}日</div><div>間取り</div><div>${esc(x.layout||'—')}</div><div>ソース</div><div>${linkHtml(x,sourceLabel(x.source))}</div></div><h3>掲載価格の推移</h3><div class="chart-wrap"><svg id="detailChart" class="chart" viewBox="0 0 640 300"></svg></div>`;drawDetail(h);if(isMobile()){$('detail').classList.add('open');$('sheetBackdrop').classList.add('open');document.body.classList.add('sheet-open')}}
function drawDetail(h){let svg=$('detailChart');if(!svg)return;if(!h.length){svg.innerHTML='<text x="320" y="150" text-anchor="middle" fill="#94a3b8">価格履歴はまだありません</text>';return}let pts=h.map(([date,price])=>({date,price:Number(price)/10000})).sort((a,b)=>a.date.localeCompare(b.date)),vals=pts.map(p=>p.price),min=Math.min(...vals),max=Math.max(...vals);if(min===max){min*=.97;max*=1.03}let L=60,R=18,T=20,B=38,W=640,H=300,x=i=>L+i*(W-L-R)/Math.max(1,pts.length-1),y=v=>T+(max-v)*(H-T-B)/(max-min);let out='';for(let i=0;i<5;i++){let v=max-(max-min)*i/4,yy=y(v);out+=`<line x1="${L}" y1="${yy}" x2="${W-R}" y2="${yy}" stroke="#e2e8f0"/><text x="${L-7}" y="${yy+4}" text-anchor="end" font-size="11" fill="#64748b">${Math.round(v).toLocaleString()}万</text>`}if(pts.length>1)out+=`<polyline points="${pts.map((p,i)=>`${x(i)},${y(p.price)}`).join(' ')}" fill="none" stroke="#2563eb" stroke-width="3"/>`;pts.forEach((p,i)=>out+=`<circle cx="${x(i)}" cy="${y(p.price)}" r="4" fill="#2563eb"><title>${p.date} ${Math.round(p.price).toLocaleString()}万円</title></circle>`);svg.innerHTML=out}
function colorFor(id,alpha=.26){let h=0;for(let i=0;i<String(id).length;i++)h=(h*31+String(id).charCodeAt(i))%360;return`hsla(${h},72%,45%,${alpha})`}
function marketHistory(x){let m=new Map();for(let p of x.history||[]){if(Array.isArray(p)&&p[0]&&p[1]!=null)m.set(String(p[0]),Number(p[1])/10000)}if(!m.size&&x.priceYen!=null)m.set(dateOnly(x.firstSeen),x.priceYen/10000);return[...m.entries()].filter(([d,v])=>d&&d!=='—'&&Number.isFinite(v)).map(([date,price])=>({date,price})).sort((a,b)=>a.date.localeCompare(b.date))}
function drawMarketChart(scope){let canvas=$('marketCanvas'),tip=$('marketTooltip'),ctx=canvas.getContext('2d'),rect=canvas.getBoundingClientRect(),dpr=Math.min(devicePixelRatio||1,2);canvas.width=Math.max(1,Math.round(rect.width*dpr));canvas.height=Math.max(1,Math.round(rect.height*dpr));ctx.setTransform(dpr,0,0,dpr,0,0);let W=rect.width,H=rect.height,L=isMobile()?48:64,R=18,T=18,B=34,series=scope.map(x=>({x,pts:marketHistory(x)})).filter(s=>s.pts.length);let dates=[...new Set(series.flatMap(s=>s.pts.map(p=>p.date)))].sort(),vals=series.flatMap(s=>s.pts.map(p=>p.price)).filter(Number.isFinite);ctx.clearRect(0,0,W,H);marketGeometry=[];$('marketCount').textContent=`${series.length.toLocaleString('ja-JP')}物件を描画`;if(!series.length||!dates.length||!vals.length){ctx.fillStyle='#94a3b8';ctx.font='13px system-ui';ctx.textAlign='center';ctx.fillText('描画できる価格履歴がありません',W/2,H/2);return}let scale=$('marketScale').value,min=Math.min(...vals),max=Math.max(...vals);if(min===max){min*=.97;max*=1.03}if(scale==='log'){min=Math.max(min,1)}let tx=d=>L+dates.indexOf(d)*(W-L-R)/Math.max(1,dates.length-1),ty=v=>{if(scale==='log'){let a=Math.log(min),b=Math.log(max);return T+(b-Math.log(Math.max(v,min)))*(H-T-B)/(b-a||1)}return T+(max-v)*(H-T-B)/(max-min||1)};ctx.strokeStyle='#e2e8f0';ctx.fillStyle='#64748b';ctx.lineWidth=1;ctx.font='11px system-ui';ctx.textAlign='right';for(let i=0;i<5;i++){let f=i/4,v=scale==='log'?Math.exp(Math.log(max)*(1-f)+Math.log(min)*f):max-(max-min)*f,y=ty(v);ctx.beginPath();ctx.moveTo(L,y);ctx.lineTo(W-R,y);ctx.stroke();ctx.fillText(Math.round(v).toLocaleString()+'万',L-6,y+4)}ctx.textAlign='center';let ticks=dates.length<6?dates:[dates[0],dates[Math.floor((dates.length-1)/2)],dates.at(-1)];ticks.forEach(d=>ctx.fillText(d.slice(5).replace('-','/'),tx(d),H-12));series.forEach(s=>{let geom=s.pts.map(p=>({px:tx(p.date),py:ty(p.price),p}));ctx.strokeStyle=colorFor(s.x.id,series.length>250?.17:.28);ctx.fillStyle=colorFor(s.x.id,.5);ctx.lineWidth=1.15;if(geom.length>1){ctx.beginPath();ctx.moveTo(geom[0].px,geom[0].py);for(let i=1;i<geom.length;i++)ctx.lineTo(geom[i].px,geom[i].py);ctx.stroke()}else{ctx.beginPath();ctx.arc(geom[0].px,geom[0].py,1.5,0,Math.PI*2);ctx.fill()}marketGeometry.push({item:s.x,geom})});function pointer(e){let r=canvas.getBoundingClientRect(),px=e.clientX-r.left,py=e.clientY-r.top,best=null,bestD=Infinity;for(let s of marketGeometry)for(let g of s.geom){let d=(g.px-px)**2+(g.py-py)**2;if(d<bestD){bestD=d;best={s,g}}}if(!best||bestD>900){tip.style.display='none';return}let item=best.s.item,p=best.g.p;tip.innerHTML=`<b>${esc(item.title||item.address||item.id)}</b><br>${esc(p.date)} · ${Math.round(p.price).toLocaleString()}万円<br>${esc(sourceLabel(item.source))}`;tip.style.display='block';let left=Math.min(W-tip.offsetWidth-8,Math.max(8,px+12)),top=Math.min(H-tip.offsetHeight-8,Math.max(8,py+12));tip.style.left=left+'px';tip.style.top=top+'px'}canvas.onpointermove=pointer;canvas.onpointerdown=pointer;canvas.onpointerleave=()=>tip.style.display='none'}
function populateSources(){let ss=[...new Set(items.map(x=>x.source).filter(Boolean))].sort();$('source').innerHTML='<option value="">全ソース</option>'+ss.map(s=>`<option value="${esc(s)}">${esc(sourceLabel(s))}</option>`).join('')}
['q','ward','source','sort'].forEach(id=>$(id).addEventListener(id==='q'?'input':'change',()=>{visibleLimit=PAGE_SIZE;render()}));$('marketScale').onchange=()=>drawMarketChart(filtered());$('loadMore').onclick=()=>{visibleLimit+=PAGE_SIZE;render()};$('sheetBackdrop').onclick=closeSheet;addEventListener('keydown',e=>{if(e.key==='Escape')closeSheet()});let resizeTimer;addEventListener('resize',()=>{clearTimeout(resizeTimer);resizeTimer=setTimeout(()=>{if(!isMobile())closeSheet();render()},120)});
(async()=>{try{let r=await fetch(DATA_URL,{cache:'no-store'});if(!r.ok)throw new Error('HTTP '+r.status);let data=await r.json(),raw=Array.isArray(data.listings)?data.listings:Object.values(data.listings||{});items=raw.map(normalize).filter(x=>x.id&&x.active!==false&&!String(x.url||'').includes('/inquire/')&&String(x.title||'')!=='資料請求'&&!isNonFreehold(x));populateSources();$('updated').textContent='最終更新: '+dateOnly(data.generated_at||data.latest_run?.completed_at);$('metricChanged').textContent=Number(data.latest_run?.metrics?.price_changed_count||0).toLocaleString('ja-JP');render();if(items[0]&&!isMobile())show(items[0].id)}catch(e){console.error(e);$('status').classList.add('error');$('status').textContent='データの読み込みに失敗しました。'}})();
</script></body></html>
