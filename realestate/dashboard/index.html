<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>品川区・目黒区 中古戸建 Price Watch</title>
<style>
:root{font-family:Inter,ui-sans-serif,system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;color:#111827;background:#f8fafc}*{box-sizing:border-box}body{margin:0}.wrap{max-width:1440px;margin:auto;padding:24px}.top{display:flex;justify-content:space-between;align-items:flex-end;gap:16px}.muted{color:#64748b}.grid{display:grid;grid-template-columns:minmax(0,1.8fr) minmax(360px,1fr);gap:20px;margin-top:20px}.card{background:#fff;border:1px solid #e2e8f0;border-radius:16px;box-shadow:0 1px 2px rgba(15,23,42,.04)}.filters{padding:16px;display:flex;gap:8px;flex-wrap:wrap}.filters input,.filters select{border:1px solid #cbd5e1;border-radius:10px;padding:9px 10px;background:#fff}.tablewrap{overflow:auto;max-height:70vh}table{width:100%;border-collapse:collapse;min-width:920px}th,td{padding:11px 12px;border-top:1px solid #f1f5f9;text-align:left;font-size:13px}th{position:sticky;top:0;background:#f8fafc;z-index:1;color:#475569}tbody tr{cursor:pointer}tbody tr:hover{background:#f8fafc}.price{font-weight:700;white-space:nowrap}.badge{display:inline-flex;padding:3px 7px;border-radius:999px;background:#f1f5f9;font-size:11px}.detail{padding:18px;position:sticky;top:20px}.detail h2{margin:0 0 4px;font-size:20px}.kv{display:grid;grid-template-columns:110px 1fr;gap:8px;font-size:13px;margin:14px 0}.chart{width:100%;height:300px;border:1px solid #e2e8f0;border-radius:12px;background:#fff}.legend{display:flex;gap:12px;flex-wrap:wrap;font-size:12px;margin-top:8px}.empty{padding:40px;text-align:center;color:#94a3b8}.link{color:#2563eb;text-decoration:none}.link:hover{text-decoration:underline}.status{padding:10px 14px;border-radius:10px;background:#eff6ff;color:#1d4ed8;font-size:13px;margin-top:12px}@media(max-width:900px){.grid{grid-template-columns:1fr}.detail{position:static}.top{align-items:flex-start;flex-direction:column}}
</style>
</head>
<body>
<div class="wrap">
  <div class="top"><div><h1 style="margin:0">中古戸建 Price Watch</h1><div class="muted">品川区・目黒区 / 夜間バッチ収集 / 履歴永続化</div></div><div id="updated" class="muted"></div></div>
  <div id="status" class="status">データ読込中…</div>
  <div class="grid">
    <div class="card">
      <div class="filters"><input id="q" placeholder="住所・駅・物件名で検索"/><select id="ward"><option value="">全区</option><option>品川区</option><option>目黒区</option></select><select id="source"><option value="">全ソース</option><option>fudousan.or.jp</option><option>SUUMO</option><option>HOME'S</option></select><select id="sort"><option value="priceAsc">価格が安い順</option><option value="priceDesc">価格が高い順</option><option value="daysDesc">掲載日数が長い順</option></select></div>
      <div class="tablewrap"><table><thead><tr><th>区</th><th>物件</th><th>価格</th><th>土地</th><th>建物</th><th>築年</th><th>駅</th><th>日数</th><th>ソース</th><th>リンク</th></tr></thead><tbody id="rows"></tbody></table></div>
    </div>
    <div class="card detail" id="detail"><div class="empty">物件を選択すると価格推移を表示します</div></div>
  </div>
</div>
<script>
const DATA_URL='https://raw.githubusercontent.com/sawamotokai/price-alerts/master/realestate/data/current.json';
const HISTORY_BASE='https://raw.githubusercontent.com/sawamotokai/price-alerts/master/realestate/data/history/';
let items=[];
const $=id=>document.getElementById(id);
function yen(v){return v==null?'—':Number(v).toLocaleString('ja-JP')+'万円'}
function area(v){return v==null?'—':Number(v).toFixed(2)+'㎡'}
function esc(s){return String(s??'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]))}
function filtered(){let a=[...items];const q=$('q').value.trim().toLowerCase(),w=$('ward').value,s=$('source').value;if(q)a=a.filter(x=>JSON.stringify(x).toLowerCase().includes(q));if(w)a=a.filter(x=>x.ward===w);if(s)a=a.filter(x=>x.source===s);const mode=$('sort').value;a.sort((x,y)=>mode==='priceDesc'?(y.price_man||0)-(x.price_man||0):mode==='daysDesc'?(y.listing_days||0)-(x.listing_days||0):(x.price_man??1e18)-(y.price_man??1e18));return a}
function render(){const a=filtered();$('rows').innerHTML=a.map(x=>`<tr data-id="${esc(x.id)}"><td>${esc(x.ward)}</td><td><b>${esc(x.title||x.address||x.id)}</b><div class="muted">${esc(x.address||'')}</div></td><td class="price">${yen(x.price_man)}</td><td>${area(x.land_sqm)}</td><td>${area(x.building_sqm)}</td><td>${esc(x.built||'—')}</td><td>${esc(x.station||'—')}</td><td>${esc(x.listing_days??0)}日</td><td><span class="badge">${esc(x.source||'')}</span></td><td><a class="link" href="${esc(x.url)}" target="_blank" rel="noopener" onclick="event.stopPropagation()">開く</a></td></tr>`).join('');document.querySelectorAll('tbody tr').forEach(tr=>tr.onclick=()=>show(tr.dataset.id));$('status').textContent=`${a.length.toLocaleString()}件表示 / ${items.length.toLocaleString()}件取得済み。表示時のスクレイピングは行っていません。`}
async function show(id){const selected=items.find(x=>x.id===id);if(!selected)return;const d=$('detail');d.innerHTML=`<h2>${esc(selected.title||selected.address||selected.id)}</h2><div class="muted">${esc(selected.address||'')}</div><div class="kv"><div>現在価格</div><b>${yen(selected.price_man)}</b><div>観測開始</div><div>${esc(selected.first_seen||'—')}</div><div>掲載日数</div><div>${esc(selected.listing_days??0)}日</div><div>間取り</div><div>${esc(selected.layout||'—')}</div><div>ソース</div><div><a class="link" href="${esc(selected.url)}" target="_blank">${esc(selected.source||'物件ページ')}</a></div></div><h3>掲載価格の推移</h3><svg class="chart" id="chart" viewBox="0 0 640 300" preserveAspectRatio="none"></svg><div id="legend" class="legend"></div>`;try{const r=await fetch(HISTORY_BASE+encodeURIComponent(id)+'.json',{cache:'no-store'});const h=r.ok?await r.json():{series:{}};draw(h.series||{});}catch(e){draw({})}}
function draw(series){const svg=$('chart'),leg=$('legend');if(!svg)return;const entries=Object.entries(series).filter(([,pts])=>Array.isArray(pts)&&pts.length);if(!entries.length){svg.innerHTML='<text x="320" y="150" text-anchor="middle" fill="#94a3b8" font-size="14">価格履歴はまだありません</text>';return}const all=entries.flatMap(([,p])=>p);const vals=all.map(p=>Number(p.price_man)).filter(Number.isFinite);const dates=[...new Set(all.map(p=>p.date))].sort();let min=Math.min(...vals),max=Math.max(...vals);if(min===max){min-=Math.max(100,min*.02);max+=Math.max(100,max*.02)}const pad={l:62,r:22,t:18,b:40},W=640,H=300,x=d=>pad.l+(Math.max(0,dates.indexOf(d)))*(W-pad.l-pad.r)/Math.max(1,dates.length-1),y=v=>pad.t+(max-v)*(H-pad.t-pad.b)/(max-min);let out='';for(let i=0;i<5;i++){const v=max-(max-min)*i/4,yy=y(v);out+=`<line x1="${pad.l}" y1="${yy}" x2="${W-pad.r}" y2="${yy}" stroke="#e2e8f0"/><text x="${pad.l-8}" y="${yy+4}" text-anchor="end" fill="#64748b" font-size="11">${Math.round(v).toLocaleString()}万</text>`}dates.forEach((dt,i)=>{if(i===0||i===dates.length-1||dates.length<6){const xx=x(dt);out+=`<text x="${xx}" y="${H-14}" text-anchor="middle" fill="#64748b" font-size="11">${dt.slice(5).replace('-','/')}</text>`}});const colors=['#2563eb','#16a34a','#dc2626'];entries.forEach(([name,pts],idx)=>{const p=[...pts].sort((a,b)=>a.date.localeCompare(b.date));const coords=p.map(z=>`${x(z.date)},${y(Number(z.price_man))}`).join(' ');out+=`<polyline points="${coords}" fill="none" stroke="${colors[idx%colors.length]}" stroke-width="3" stroke-linejoin="round"/>`;p.forEach(z=>out+=`<circle cx="${x(z.date)}" cy="${y(Number(z.price_man))}" r="4" fill="${colors[idx%colors.length]}"/>`)});svg.innerHTML=out;leg.innerHTML=entries.map(([n],i)=>`<span><b style="color:${colors[i%colors.length]}">●</b> ${esc(n)}</span>`).join('')}
['q','ward','source','sort'].forEach(id=>$(id).addEventListener(id==='q'?'input':'change',render));
(async()=>{try{const r=await fetch(DATA_URL,{cache:'no-store'});if(!r.ok)throw new Error('HTTP '+r.status);const data=await r.json();items=data.items||[];$('updated').textContent='最終更新: '+(data.observed_at||'—');render();if(items[0])show(items[0].id)}catch(e){$('status').textContent='データストアは初期化済みですが、まだ最初のスナップショットがありません。'}})();
</script>
</body></html>
