<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>品川・目黒 不動産 Price Watch</title>
<style>
:root{font-family:system-ui,-apple-system,sans-serif;color:#172033;background:#f6f7fb;--card:#fff;--line:#d9dfeb;--muted:#667085;--accent:#2563eb}*{box-sizing:border-box}body{margin:0;background:#f6f7fb}.app{max-width:1450px;margin:auto;padding:20px}h1{margin:0;font-size:clamp(25px,4vw,40px);letter-spacing:-.04em}.top{display:flex;justify-content:space-between;align-items:end;gap:16px}.muted{color:var(--muted)}.status,.card,.metric{background:var(--card);border:1px solid var(--line);border-radius:13px}.status{padding:10px 12px;margin:14px 0 10px}.status.error{color:#b42318;border-color:#f5b6c2;background:#fff3f5}.chips{display:flex;gap:7px;flex-wrap:wrap}.chip{padding:6px 9px;border-radius:999px;border:1px solid var(--line);background:#fff;font-size:12px}.chip.ok{color:#067647}.chip.no{color:#b42318}.metrics{display:grid;grid-template-columns:repeat(6,1fr);gap:8px;margin:12px 0}.metric{padding:11px}.metric span{display:block;color:var(--muted);font-size:11px}.metric strong{display:block;font-size:21px;margin-top:3px}.grid{display:grid;grid-template-columns:minmax(0,1.8fr) minmax(330px,.75fr);gap:13px}.filters{display:grid;grid-template-columns:1.7fr repeat(5,.75fr);gap:7px;padding:11px;border-bottom:1px solid var(--line)}input,select{width:100%;min-width:0;padding:9px 10px;border:1px solid #ccd4e0;border-radius:8px;background:#fff;color:#172033}.tablewrap{overflow:auto;max-height:calc(100vh - 270px)}table{width:100%;border-collapse:collapse;min-width:1060px}th,td{padding:9px 10px;border-top:1px solid #edf0f5;text-align:left;vertical-align:top;font-size:12px}th{position:sticky;top:0;background:#f8fafc;color:#475467;z-index:2}.row{cursor:pointer}.row:hover,.row.selected{background:#f1f5fb}.name{font-weight:750}.address{color:var(--muted);font-size:11px;margin-top:3px;max-width:350px}.price{font-weight:850;font-size:14px;white-space:nowrap}.badge{display:inline-flex;padding:3px 7px;border-radius:999px;border:1px solid #c8d5e7;background:#f5f8fc;font-size:10px}.detail{padding:16px;position:sticky;top:14px;max-height:calc(100vh - 28px);overflow:auto}.detail h2{margin:0}.detail-price{font-size:28px;font-weight:900;margin:8px 0}.kv{display:grid;grid-template-columns:100px 1fr;gap:7px;font-size:13px;margin:15px 0}.kv div:nth-child(odd){color:var(--muted)}.history{width:100%;min-width:0}.history th,.history td{padding:7px}.open{display:block;text-align:center;padding:10px;background:var(--accent);color:#fff;text-decoration:none;border-radius:9px;font-weight:800;margin-top:12px}.mobile{display:none;padding:8px}.mobile-card{border-top:1px solid #edf0f5;padding:12px;cursor:pointer}.mobile-head{display:flex;justify-content:space-between;gap:9px}.empty{padding:35px;text-align:center;color:var(--muted)}
@media(max-width:1100px){.metrics{grid-template-columns:repeat(3,1fr)}.grid{grid-template-columns:1fr}.detail{position:static;max-height:none}.filters{grid-template-columns:repeat(3,1fr)}#q{grid-column:1/-1}.tablewrap{max-height:none}}
@media(max-width:700px){.app{padding:11px}.top{display:block}.metrics{grid-template-columns:repeat(2,1fr)}.filters{grid-template-columns:1fr 1fr}.tablewrap{display:none}.mobile{display:block}.detail{margin-top:10px}}
</style>
</head>
<body>
<div class="app">
<header class="top"><div><h1>不動産 Price Watch</h1><div class="muted">品川区・目黒区｜中古戸建・土地｜所有権確認済みのみ</div></div><div id="updated" class="muted"></div></header>
<div id="status" class="status">GitHubの夜間スナップショットを読み込んでいます。</div>
<div id="chips" class="chips"></div>
<section class="metrics"><div class="metric"><span>表示</span><strong id="shown">—</strong></div><div class="metric"><span>全掲載</span><strong id="total">—</strong></div><div class="metric"><span>価格取得率</span><strong id="priced">—</strong></div><div class="metric"><span>新規</span><strong id="newc">—</strong></div><div class="metric"><span>価格変更</span><strong id="changed">—</strong></div><div class="metric"><span>掲載終了候補</span><strong id="ended">—</strong></div></section>
<main class="grid">
<section class="card"><div class="filters"><input id="q" type="search" placeholder="住所・駅・物件名"><select id="ward"><option value="">全区</option><option>品川区</option><option>目黒区</option></select><select id="source"><option value="">全ソース</option></select><select id="type"><option value="">戸建＋土地</option><option value="house">中古戸建</option><option value="land">土地</option></select><select id="max"><option value="">上限なし</option><option value="6000">6,000万円以下</option><option value="8000">8,000万円以下</option><option value="10000">1億円以下</option><option value="15000">1.5億円以下</option></select><select id="sort"><option value="asc">価格が安い順</option><option value="desc">価格が高い順</option><option value="new">新着順</option><option value="days">掲載日数順</option><option value="drop">値下げ順</option></select></div><div class="tablewrap"><table><thead><tr><th>区</th><th>物件</th><th>価格</th><th>土地</th><th>建物</th><th>間取り</th><th>駅</th><th>日数</th><th>ソース</th><th>掲載</th></tr></thead><tbody id="rows"></tbody></table></div><div id="mobile" class="mobile"></div></section>
<aside id="detail" class="card detail"><div class="empty">物件を選択すると価格履歴を表示します。</div></aside>
</main>
</div>
<script>
'use strict';
const ROOT='https://raw.githubusercontent.com/sawamotokai/price-alerts/master/realestate/data';
const $=id=>document.getElementById(id);
const esc=v=>String(v??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const sourceName=s=>({suumo:'SUUMO',homes:"HOME'S",adcast:'ADCAST',fudousan_japan:'fudousan.or.jp'}[String(s||'').toLowerCase()]||s||'不明');
const money=v=>Number.isFinite(Number(v))?`${Math.round(Number(v)/10000).toLocaleString('ja-JP')}万円`:'—';
const area=v=>Number.isFinite(Number(v))?`${Number(v).toLocaleString('ja-JP',{maximumFractionDigits:2})}㎡`:'—';
const dateOnly=v=>String(v||'').slice(0,10);
const propertyType=r=>r.property_type==='land'||(!r.building_area_sqm&&!r.layout)?'land':'house';
const observedDays=r=>{const a=new Date(dateOnly(r.first_seen));const b=new Date(dateOnly(r.last_seen)||Date.now());return Number.isFinite(a.getTime())?Math.max(0,Math.round((b-a)/86400000)):0};
const embeddedHistory=r=>(r.price_history||[]).map(p=>Array.isArray(p)?[dateOnly(p[0]),Number(p[1])]:[dateOnly(p.date),Number(p.price_yen)]).filter(p=>p[0]&&Number.isFinite(p[1]));
const priceDelta=r=>{const h=embeddedHistory(r);return h.length>1?h[h.length-1][1]-h[0][1]:Number(r.price_change_yen||0)};
let listings=[],filtered=[],report={},selectedId='';
async function readJson(url){const response=await fetch(`${url}?t=${Date.now()}`,{cache:'no-store'});if(!response.ok)throw new Error(`${response.status} ${response.statusText}`);return response.json()}
async function load(){try{const [dashboard,nightly]=await Promise.all([readJson(`${ROOT}/dashboard.json`),readJson(`${ROOT}/nightly_report.json`)]);report=nightly||{};const rows=Array.isArray(dashboard.listings)?dashboard.listings:Object.values(dashboard.listings||{});listings=rows.filter(r=>r&&r.active!==false&&r.land_right_status==='freehold'&&['品川区','目黒区'].includes(r.ward));$('updated').textContent=`最終観測 ${new Date(report.observed_at||dashboard.generated_at||Date.now()).toLocaleString('ja-JP')}`;$('status').textContent=`永続化済みデータを表示中。表示時のスクレイピングは行いません。所有権確認済み ${listings.length}件。`;renderCoverage();setupSources();apply();if(listings[0])showDetail(listings[0])}catch(error){$('status').className='status error';$('status').textContent=`データ読込失敗: ${error.message}`}}
function renderCoverage(){const coverage=report.coverage||{},counts=report.source_counts||{};$('chips').innerHTML=['SUUMO',"HOME'S",'ADCAST','fudousan.or.jp'].map(source=>`<span class="chip ${coverage[source]?'ok':'no'}">${esc(source)} ${coverage[source]?'全ページ完了':'部分・未取得'}・${Number(counts[source]||0).toLocaleString('ja-JP')}件</span>`).join('')}
function setupSources(){const values=[...new Set(listings.map(r=>sourceName(r.source)))].sort();$('source').innerHTML='<option value="">全ソース</option>'+values.map(v=>`<option>${esc(v)}</option>`).join('')}
function apply(){const q=$('q').value.trim().toLowerCase(),ward=$('ward').value,source=$('source').value,type=$('type').value,max=Number($('max').value||0),sort=$('sort').value;filtered=listings.filter(r=>{const text=[r.title,r.address,r.access,r.ward].join(' ').toLowerCase();const price=Number(r.price_yen||0)/10000;return(!q||text.includes(q))&&(!ward||r.ward===ward)&&(!source||sourceName(r.source)===source)&&(!type||propertyType(r)===type)&&(!max||!price||price<=max)});filtered.sort((a,b)=>sort==='desc'?Number(b.price_yen||-1)-Number(a.price_yen||-1):sort==='new'?String(b.first_seen||'').localeCompare(String(a.first_seen||'')):sort==='days'?observedDays(b)-observedDays(a):sort==='drop'?priceDelta(a)-priceDelta(b):Number(a.price_yen||1e30)-Number(b.price_yen||1e30));renderListings();renderMetrics()}
function renderMetrics(){$('shown').textContent=filtered.length.toLocaleString('ja-JP');$('total').textContent=listings.length.toLocaleString('ja-JP');const priced=listings.filter(r=>Number.isFinite(Number(r.price_yen))).length;$('priced').textContent=listings.length?`${(priced*100/listings.length).toFixed(1)}%`:'0%';$('newc').textContent=Number(report.new_count||0).toLocaleString('ja-JP');$('changed').textContent=Number(report.price_changed_count||0).toLocaleString('ja-JP');$('ended').textContent=Number(report.listing_ended_candidate_count||0).toLocaleString('ja-JP')}
function renderListings(){const row=r=>`<tr class="row ${selectedId===(r.listing_id||r.id)?'selected':''}" data-id="${esc(r.listing_id||r.id)}"><td>${esc(r.ward||'—')}</td><td><div class="name">${esc(r.title||'名称未取得')}</div><div class="address">${esc(r.address||'')}</div></td><td class="price">${money(r.price_yen)}</td><td>${area(r.land_area_sqm)}</td><td>${area(r.building_area_sqm)}</td><td>${esc(r.layout||'—')}</td><td>${esc(r.access||'—')}</td><td>${observedDays(r)}日</td><td><span class="badge">${esc(sourceName(r.source))}</span></td><td><a href="${esc(r.url)}" target="_blank" rel="noopener" onclick="event.stopPropagation()">開く</a></td></tr>`;$('rows').innerHTML=filtered.length?filtered.map(row).join(''):'<tr><td colspan="10" class="empty">該当する物件はありません。</td></tr>';$('mobile').innerHTML=filtered.map(r=>`<article class="mobile-card" data-id="${esc(r.listing_id||r.id)}"><div class="mobile-head"><strong>${esc(r.title||'名称未取得')}</strong><span class="price">${money(r.price_yen)}</span></div><div class="address">${esc(r.address||'')}</div><div class="muted">土地 ${area(r.land_area_sqm)} / 建物 ${area(r.building_area_sqm)} / ${esc(r.layout||(propertyType(r)==='land'?'土地':'—'))} / ${esc(sourceName(r.source))}</div></article>`).join('');document.querySelectorAll('[data-id]').forEach(element=>element.addEventListener('click',()=>{const record=listings.find(r=>String(r.listing_id||r.id)===element.dataset.id);if(record)showDetail(record)}))}
async function showDetail(record){selectedId=record.listing_id||record.id;renderListings();let points=embeddedHistory(record);let historyLabel='current.json';try{const history=await readJson(`${ROOT}/history/${encodeURIComponent(selectedId)}.json`);const flattened=Object.entries(history.series||{}).flatMap(([source,series])=>(series||[]).map(point=>({source,date:dateOnly(point.date),price_man:Number(point.price_man)}))).filter(point=>point.date&&Number.isFinite(point.price_man));if(flattened.length){points=flattened.sort((a,b)=>a.date.localeCompare(b.date));historyLabel='history JSON'}}catch(_error){}const rows=points.length?points.map(point=>Array.isArray(point)?`<tr><td>${esc(point[0])}</td><td>${money(point[1])}</td><td>${esc(sourceName(record.source))}</td></tr>`:`<tr><td>${esc(point.date)}</td><td>${Number(point.price_man).toLocaleString('ja-JP')}万円</td><td>${esc(point.source)}</td></tr>`).join(''):'<tr><td colspan="3">履歴はまだありません。</td></tr>';$('detail').innerHTML=`<h2>${esc(record.title||'名称未取得')}</h2><div class="detail-price">${money(record.price_yen)}</div><div class="muted">${esc(record.address||'')}</div><div class="kv"><div>種別</div><div>${propertyType(record)==='land'?'土地':'中古戸建'}</div><div>土地面積</div><div>${area(record.land_area_sqm)}</div><div>建物面積</div><div>${area(record.building_area_sqm)}</div><div>間取り</div><div>${esc(record.layout||'—')}</div><div>築年月</div><div>${esc(record.built_year_month||'—')}</div><div>交通</div><div>${esc(record.access||'—')}</div><div>土地権利</div><div>所有権（確認済み）</div><div>ソース</div><div>${esc(sourceName(record.source))}</div></div><h3>価格履歴</h3><div class="muted">${esc(historyLabel)} / 同一日・同一ソースにつき価格1点</div><table class="history"><thead><tr><th>日付</th><th>価格</th><th>ソース</th></tr></thead><tbody>${rows}</tbody></table><a class="open" href="${esc(record.url)}" target="_blank" rel="noopener">掲載ページを開く</a>`}
['q','ward','source','type','max','sort'].forEach(id=>$(id).addEventListener(id==='q'?'input':'change',apply));
load();setInterval(load,15*60*1000);
</script>
</body>
</html>
