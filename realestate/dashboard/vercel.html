<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#f6f7fb">
<title>品川・目黒 不動産 Price Watch</title>
<style>
:root{font-family:Inter,ui-sans-serif,system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;color:#172033;background:#f6f7fb;--card:#fff;--line:#d9dfeb;--muted:#667085;--accent:#2563eb;--accent-soft:#eff6ff;--good:#067647;--bad:#b42318}*{box-sizing:border-box}html,body{margin:0;min-height:100%;background:#f6f7fb}button,input,select{font:inherit}.app{max-width:1500px;margin:auto;padding:20px}.top{display:flex;justify-content:space-between;align-items:end;gap:16px}h1{margin:0;font-size:clamp(25px,4vw,40px);letter-spacing:-.04em}.muted{color:var(--muted)}.status,.card,.metric{background:var(--card);border:1px solid var(--line);border-radius:14px}.status{padding:10px 12px;margin:14px 0 10px}.status.error{color:var(--bad);border-color:#f5b6c2;background:#fff3f5}.chips{display:flex;gap:7px;flex-wrap:wrap}.chip{padding:6px 9px;border-radius:999px;border:1px solid var(--line);background:#fff;font-size:12px}.chip.ok{color:var(--good)}.chip.no{color:var(--bad)}.metrics{display:grid;grid-template-columns:repeat(6,1fr);gap:8px;margin:12px 0}.metric{padding:11px}.metric span{display:block;color:var(--muted);font-size:11px}.metric strong{display:block;font-size:21px;margin-top:3px}.grid{display:grid;grid-template-columns:minmax(0,1.72fr) minmax(380px,.82fr);gap:13px;align-items:start}.filters{display:grid;grid-template-columns:1.7fr repeat(5,.75fr);gap:7px;padding:11px;border-bottom:1px solid var(--line)}input,select{width:100%;min-width:0;padding:9px 10px;border:1px solid #ccd4e0;border-radius:9px;background:#fff;color:#172033;outline:none}input:focus,select:focus{border-color:#60a5fa;box-shadow:0 0 0 3px rgba(37,99,235,.1)}.tablewrap{overflow:auto;max-height:calc(100vh - 270px)}table{width:100%;border-collapse:collapse;min-width:1060px}th,td{padding:9px 10px;border-top:1px solid #edf0f5;text-align:left;vertical-align:top;font-size:12px}th{position:sticky;top:0;background:#f8fafc;color:#475467;z-index:2}.row{cursor:pointer}.row:hover,.row.selected{background:#f1f5fb}.name{font-weight:750}.address{color:var(--muted);font-size:11px;margin-top:3px;max-width:360px}.price{font-weight:850;font-size:14px;white-space:nowrap}.badge{display:inline-flex;padding:3px 7px;border-radius:999px;border:1px solid #c8d5e7;background:#f5f8fc;font-size:10px}.detail{padding:16px;position:sticky;top:14px;max-height:calc(100vh - 28px);overflow:auto}.detail h2{margin:0;font-size:20px}.detail-price{font-size:28px;font-weight:900;margin:8px 0}.kv{display:grid;grid-template-columns:100px 1fr;gap:7px;font-size:13px;margin:15px 0}.kv div:nth-child(odd){color:var(--muted)}.chart-card{margin-top:14px;border:1px solid var(--line);border-radius:12px;background:#fff;overflow:hidden}.chart-head{display:flex;justify-content:space-between;gap:12px;align-items:flex-start;padding:11px 12px;border-bottom:1px solid #edf0f5}.chart-head strong{font-size:14px}.chart-meta{font-size:11px;color:var(--muted);text-align:right}.chart-wrap{padding:7px 6px 0;overflow:hidden;background:linear-gradient(180deg,#fff,#fbfdff)}.chart-svg{display:block;width:100%;height:auto;min-height:235px}.chart-empty{padding:34px 16px;text-align:center;color:var(--muted)}.legend{display:flex;gap:9px;flex-wrap:wrap;padding:0 12px 10px;font-size:11px;color:var(--muted)}.legend-item{display:inline-flex;align-items:center;gap:5px}.legend-dot{width:8px;height:8px;border-radius:999px;display:inline-block}.history-wrap{overflow:auto;margin-top:10px;border:1px solid var(--line);border-radius:10px}.history{min-width:0}.history th{position:static}.history th,.history td{padding:7px}.open{display:block;text-align:center;padding:10px;background:var(--accent);color:#fff;text-decoration:none;border-radius:9px;font-weight:800;margin-top:12px}.mobile{display:none;padding:8px}.mobile-card{border-top:1px solid #edf0f5;padding:12px;cursor:pointer}.mobile-head{display:flex;justify-content:space-between;gap:9px}.empty{padding:35px;text-align:center;color:var(--muted)}.loading{opacity:.65}.version{font-size:10px;margin-top:3px}
@media(max-width:1150px){.metrics{grid-template-columns:repeat(3,1fr)}.grid{grid-template-columns:1fr}.detail{position:static;max-height:none}.filters{grid-template-columns:repeat(3,1fr)}#q{grid-column:1/-1}.tablewrap{max-height:none}}
@media(max-width:700px){.app{padding:11px 10px calc(20px + env(safe-area-inset-bottom))}.top{display:block}.metrics{grid-template-columns:repeat(2,1fr)}.filters{grid-template-columns:1fr 1fr}.tablewrap{display:none}.mobile{display:block}.detail{margin-top:10px}.chart-svg{min-height:210px}.chart-head{display:block}.chart-meta{text-align:left;margin-top:3px}}
</style>
</head>
<body>
<div class="app">
<header class="top"><div><h1>不動産 Price Watch</h1><div class="muted">品川区・目黒区｜中古戸建・土地｜所有権確認済みのみ</div><div class="muted version">current.json＋listing_id別history JSONのみを表示</div></div><div id="updated" class="muted"></div></header>
<div id="status" class="status">GitHubの永続データを読み込んでいます。</div>
<div id="chips" class="chips"></div>
<section class="metrics"><div class="metric"><span>表示</span><strong id="shown">—</strong></div><div class="metric"><span>全掲載</span><strong id="total">—</strong></div><div class="metric"><span>価格取得率</span><strong id="priced">—</strong></div><div class="metric"><span>新規</span><strong id="newc">—</strong></div><div class="metric"><span>価格変更</span><strong id="changed">—</strong></div><div class="metric"><span>掲載終了候補</span><strong id="ended">—</strong></div></section>
<main class="grid">
<section class="card"><div class="filters"><input id="q" type="search" placeholder="住所・駅・物件名"><select id="ward"><option value="">全区</option><option>品川区</option><option>目黒区</option></select><select id="source"><option value="">全ソース</option></select><select id="type"><option value="">戸建＋土地</option><option value="house">中古戸建</option><option value="land">土地</option></select><select id="max"><option value="">上限なし</option><option value="6000">6,000万円以下</option><option value="8000">8,000万円以下</option><option value="10000">1億円以下</option><option value="15000">1.5億円以下</option></select><select id="sort"><option value="asc">価格が安い順</option><option value="desc">価格が高い順</option><option value="new">新着順</option><option value="days">掲載日数順</option><option value="drop">値下げ順</option></select></div><div class="tablewrap"><table><thead><tr><th>区</th><th>物件</th><th>価格</th><th>土地</th><th>建物</th><th>間取り</th><th>駅</th><th>日数</th><th>ソース</th><th>掲載</th></tr></thead><tbody id="rows"></tbody></table></div><div id="mobile" class="mobile"></div></section>
<aside id="detail" class="card detail"><div class="empty">物件を選択すると、日次価格を線で結んだ履歴を表示します。</div></aside>
</main>
</div>
<script>
'use strict';
const ROOT='https://raw.githubusercontent.com/sawamotokai/price-alerts/master/realestate/data';
const TARGET_WARDS=new Set(['品川区','目黒区']);
const SOURCE_ORDER=['SUUMO',"HOME'S",'ADCAST','fudousan.or.jp'];
const SOURCE_COLORS={'SUUMO':'#2563eb',"HOME'S":'#0f9d7a','ADCAST':'#ea580c','fudousan.or.jp':'#7c3aed'};
const $=id=>document.getElementById(id);
const esc=value=>String(value??'').replace(/[&<>"']/g,char=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot',"'":'&#39;'}[char]));
const sourceName=value=>({suumo:'SUUMO',homes:"HOME'S","home's":"HOME'S",adcast:'ADCAST','ad-cast.info':'ADCAST',fudousan_japan:'fudousan.or.jp','fudousan.or.jp':'fudousan.or.jp'}[String(value||'').toLowerCase()]||String(value||'不明'));
const money=value=>Number.isFinite(Number(value))?`${Math.round(Number(value)/10000).toLocaleString('ja-JP')}万円`:'—';
const area=value=>Number.isFinite(Number(value))?`${Number(value).toLocaleString('ja-JP',{maximumFractionDigits:2})}㎡`:'—';
const dateOnly=value=>String(value||'').slice(0,10);
const propertyType=record=>record.property_type==='land'||(!record.building_area_sqm&&!record.layout)?'land':'house';
const observedDays=record=>{const start=new Date(`${dateOnly(record.first_seen)}T00:00:00Z`);const end=new Date(`${dateOnly(record.last_seen)||dateOnly(observedAt)}T00:00:00Z`);return Number.isFinite(start.getTime())&&Number.isFinite(end.getTime())?Math.max(0,Math.round((end-start)/86400000)):0};
let currentData={},listings=[],filtered=[],selectedId='',observedAt='';

async function readJson(url){const separator=url.includes('?')?'&':'?';const response=await fetch(`${url}${separator}t=${Date.now()}`,{cache:'no-store'});if(!response.ok)throw new Error(`${response.status} ${response.statusText}`);return response.json()}
function sourceCovered(value){if(typeof value==='boolean')return value;if(!value||typeof value!=='object'||value.success!==true||value.page_cap_reached)return false;const wards=value.wards;if(wards&&typeof wards==='object')return Object.values(wards).every(status=>status&&status.success===true&&!status.page_cap_reached);return true}
function coverageMap(data){const ingest=data.ingest_snapshot?.coverage;if(ingest&&typeof ingest==='object'&&SOURCE_ORDER.some(source=>source in ingest))return Object.fromEntries(SOURCE_ORDER.map(source=>[source,Boolean(ingest[source])]));const raw=data.coverage||{};return{'SUUMO':sourceCovered(raw.suumo),"HOME'S":sourceCovered(raw.homes),'ADCAST':sourceCovered(raw.adcast),'fudousan.or.jp':false}}
function normalizedRows(data){const raw=data.listings||{};const rows=Array.isArray(raw)?raw:Object.entries(raw).map(([id,record])=>({...record,listing_id:record.listing_id||record.id||id}));const deduped=new Map();for(const record of rows){if(!record||record.active===false||record.land_right_status!=='freehold'||!TARGET_WARDS.has(record.ward))continue;const url=String(record.url||'');if(!/^https?:\/\//.test(url)||/\/(?:inquire|inquiry|contact|request)\//i.test(url))continue;const key=`${sourceName(record.source)}|${url}`;const score=['title','address','price_yen','land_area_sqm','building_area_sqm','layout','built_year_month','access'].reduce((sum,key)=>sum+(record[key]!==null&&record[key]!==undefined&&record[key]!==''),0);const previous=deduped.get(key);if(!previous||score>previous.__score)deduped.set(key,{...record,__score:score})}return[...deduped.values()].map(record=>{delete record.__score;return record})}
function embeddedPoints(record){const source=sourceName(record.source),points=[];for(const point of record.price_history||[]){let date='',priceYen=NaN;if(Array.isArray(point)){date=dateOnly(point[0]);priceYen=Number(point[1])}else if(point&&typeof point==='object'){date=dateOnly(point.date);priceYen=Number(point.price_yen??(Number(point.price_man)*10000))}if(date&&Number.isFinite(priceYen))points.push({date,priceYen,source})}return points}
function mergePoints(...groups){const merged=new Map();for(const point of groups.flat()){if(!point||!point.date||!Number.isFinite(Number(point.priceYen)))continue;const normalized={date:dateOnly(point.date),priceYen:Number(point.priceYen),source:sourceName(point.source)};merged.set(`${normalized.source}|${normalized.date}`,normalized)}return[...merged.values()].sort((a,b)=>a.date.localeCompare(b.date)||a.source.localeCompare(b.source))}
function priceDelta(record){const points=embeddedPoints(record);return points.length>1?points.at(-1).priceYen-points[0].priceYen:Number(record.price_change_yen||0)}
function validPrice(record){return Number.isFinite(Number(record.price_yen))&&Number(record.price_yen)>0}
function labelFor(record){const raw=String(record.title||'').trim();if(raw&&raw!=='資料請求'&&raw!=='詳細を見る 詳細')return raw;return `${String(record.address||'住所未取得').replace(/^東京都/,'')} ${propertyType(record)==='land'?'土地':'中古戸建'}`}

async function load(){try{currentData=await readJson(`${ROOT}/current.json`);observedAt=currentData.ingest_snapshot?.observed_at||currentData.latest_run?.completed_at||currentData.generated_at||new Date().toISOString();listings=normalizedRows(currentData);$('updated').textContent=`最終観測 ${new Date(observedAt).toLocaleString('ja-JP')}`;$('status').className='status';$('status').textContent=`永続化済みcurrent.jsonを表示中。表示時の不動産サイト取得はありません。所有権確認済み ${listings.length}件。`;renderCoverage();setupSources();apply();const selected=listings.find(record=>String(record.listing_id||record.id)===String(selectedId));if(selected)showDetail(selected);else if(listings[0])showDetail(listings[0])}catch(error){$('status').className='status error';$('status').textContent=`データ読込失敗: ${error.message}`}}
function renderCoverage(){const coverage=coverageMap(currentData),counts=Object.fromEntries(SOURCE_ORDER.map(source=>[source,listings.filter(record=>sourceName(record.source)===source).length]));$('chips').innerHTML=SOURCE_ORDER.map(source=>`<span class="chip ${coverage[source]?'ok':'no'}">${esc(source)} ${coverage[source]?'全ページ完了':'部分・未取得'}・${Number(counts[source]||0).toLocaleString('ja-JP')}件</span>`).join('')}
function setupSources(){const values=[...new Set(listings.map(record=>sourceName(record.source)))].sort();$('source').innerHTML='<option value="">全ソース</option>'+values.map(value=>`<option>${esc(value)}</option>`).join('')}
function apply(){const query=$('q').value.trim().toLowerCase(),ward=$('ward').value,source=$('source').value,type=$('type').value,max=Number($('max').value||0),sort=$('sort').value;filtered=listings.filter(record=>{const text=[labelFor(record),record.address,record.access,record.ward].join(' ').toLowerCase(),price=Number(record.price_yen||0)/10000;return(!query||text.includes(query))&&(!ward||record.ward===ward)&&(!source||sourceName(record.source)===source)&&(!type||propertyType(record)===type)&&(!max||!price||price<=max)});filtered.sort((a,b)=>sort==='desc'?Number(b.price_yen||-1)-Number(a.price_yen||-1):sort==='new'?String(b.first_seen||'').localeCompare(String(a.first_seen||'')):sort==='days'?observedDays(b)-observedDays(a):sort==='drop'?priceDelta(a)-priceDelta(b):Number(a.price_yen||1e30)-Number(b.price_yen||1e30));renderListings();renderMetrics()}
function runDay(){return dateOnly(observedAt)}
function renderMetrics(){const coverage=coverageMap(currentData),allCurrent=currentData.listings||{},allRows=Array.isArray(allCurrent)?allCurrent:Object.values(allCurrent);$('shown').textContent=filtered.length.toLocaleString('ja-JP');$('total').textContent=listings.length.toLocaleString('ja-JP');const priced=listings.filter(validPrice).length;$('priced').textContent=listings.length?`${(priced*100/listings.length).toFixed(1)}%`:'0%';$('newc').textContent=listings.filter(record=>dateOnly(record.first_seen)===runDay()).length.toLocaleString('ja-JP');$('changed').textContent=listings.filter(record=>priceDelta(record)!==0).length.toLocaleString('ja-JP');$('ended').textContent=allRows.filter(record=>record&&record.active===false&&record.land_right_status==='freehold'&&dateOnly(record.ended_at)===runDay()&&coverage[sourceName(record.source)]).length.toLocaleString('ja-JP')}
function renderListings(){const row=record=>`<tr class="row ${String(selectedId)===String(record.listing_id||record.id)?'selected':''}" data-id="${esc(record.listing_id||record.id)}"><td>${esc(record.ward||'—')}</td><td><div class="name">${esc(labelFor(record))}</div><div class="address">${esc(record.address||'')}</div></td><td class="price">${money(record.price_yen)}</td><td>${area(record.land_area_sqm)}</td><td>${area(record.building_area_sqm)}</td><td>${esc(record.layout||'—')}</td><td>${esc(record.access||'—')}</td><td>${observedDays(record)}日</td><td><span class="badge">${esc(sourceName(record.source))}</span></td><td><a href="${esc(record.url)}" target="_blank" rel="noopener" onclick="event.stopPropagation()">開く</a></td></tr>`;$('rows').innerHTML=filtered.length?filtered.map(row).join(''):'<tr><td colspan="10" class="empty">該当する物件はありません。</td></tr>';$('mobile').innerHTML=filtered.map(record=>`<article class="mobile-card" data-id="${esc(record.listing_id||record.id)}"><div class="mobile-head"><strong>${esc(labelFor(record))}</strong><span class="price">${money(record.price_yen)}</span></div><div class="address">${esc(record.address||'')}</div><div class="muted">土地 ${area(record.land_area_sqm)} / 建物 ${area(record.building_area_sqm)} / ${esc(record.layout||(propertyType(record)==='land'?'土地':'—'))} / ${esc(sourceName(record.source))}</div></article>`).join('');document.querySelectorAll('[data-id]').forEach(element=>element.addEventListener('click',()=>{const record=listings.find(item=>String(item.listing_id||item.id)===element.dataset.id);if(record)showDetail(record)}))}

function chartMarkup(points){if(!points.length)return'<div class="chart-empty">価格履歴はまだありません。</div>';const width=720,height=300,left=72,right=22,top=24,bottom=54,plotWidth=width-left-right,plotHeight=height-top-bottom;const times=points.map(point=>Date.parse(`${point.date}T00:00:00Z`)).filter(Number.isFinite),values=points.map(point=>point.priceYen);let minTime=Math.min(...times),maxTime=Math.max(...times),minPrice=Math.min(...values),maxPrice=Math.max(...values);if(minTime===maxTime){minTime-=43200000;maxTime+=43200000}const rawRange=maxPrice-minPrice,pad=Math.max(rawRange*.12,maxPrice*.012,500000);minPrice=Math.max(0,minPrice-pad);maxPrice+=pad;if(minPrice===maxPrice)maxPrice=minPrice+1000000;const x=time=>left+(time-minTime)/(maxTime-minTime)*plotWidth,y=price=>top+(maxPrice-price)/(maxPrice-minPrice)*plotHeight;let grid='';for(let index=0;index<5;index++){const ratio=index/4,price=maxPrice-(maxPrice-minPrice)*ratio,py=top+plotHeight*ratio;grid+=`<line x1="${left}" y1="${py.toFixed(2)}" x2="${width-right}" y2="${py.toFixed(2)}" stroke="#e8edf5"/><text x="${left-8}" y="${(py+4).toFixed(2)}" text-anchor="end" font-size="11" fill="#667085">${esc(money(price))}</text>`}const uniqueDates=[...new Set(points.map(point=>point.date))].sort(),tickDates=uniqueDates.length<=7?uniqueDates:[uniqueDates[0],uniqueDates[Math.floor((uniqueDates.length-1)/2)],uniqueDates.at(-1)];let xLabels='';for(const value of tickDates){const px=x(Date.parse(`${value}T00:00:00Z`));xLabels+=`<line x1="${px.toFixed(2)}" y1="${height-bottom}" x2="${px.toFixed(2)}" y2="${height-bottom+5}" stroke="#98a2b3"/><text x="${px.toFixed(2)}" y="${height-27}" text-anchor="middle" font-size="11" fill="#667085">${esc(value.slice(5).replace('-','/'))}</text>`}const groups=new Map();for(const point of points){const source=sourceName(point.source);if(!groups.has(source))groups.set(source,[]);groups.get(source).push(point)}let plots='',legend='';for(const [source,series] of groups){series.sort((a,b)=>a.date.localeCompare(b.date));const color=SOURCE_COLORS[source]||'#334155',coords=series.map(point=>`${x(Date.parse(`${point.date}T00:00:00Z`)).toFixed(2)},${y(point.priceYen).toFixed(2)}`);if(coords.length>=2)plots+=`<polyline points="${coords.join(' ')}" fill="none" stroke="${color}" stroke-width="4" stroke-linecap="round" stroke-linejoin="round" vector-effect="non-scaling-stroke"/>`;for(const point of series){const px=x(Date.parse(`${point.date}T00:00:00Z`)),py=y(point.priceYen);plots+=`<circle cx="${px.toFixed(2)}" cy="${py.toFixed(2)}" r="5" fill="#fff" stroke="${color}" stroke-width="3"><title>${esc(`${point.date} ${money(point.priceYen)} ${source}`)}</title></circle>`}legend+=`<span class="legend-item"><span class="legend-dot" style="background:${color}"></span>${esc(source)}</span>`}return`<div class="chart-wrap"><svg class="chart-svg" viewBox="0 0 ${width} ${height}" role="img" aria-label="${points.length}点の掲載価格推移">${grid}<line x1="${left}" y1="${height-bottom}" x2="${width-right}" y2="${height-bottom}" stroke="#98a2b3"/>${xLabels}${plots}</svg></div><div class="legend">${legend}</div>`}
async function historyPoints(record){const embedded=embeddedPoints(record),external=[];try{const history=await readJson(`${ROOT}/history/${encodeURIComponent(record.listing_id||record.id)}.json`);for(const [source,series] of Object.entries(history.series||{})){for(const point of series||[]){const date=dateOnly(point.date),priceMan=Number(point.price_man);if(date&&Number.isFinite(priceMan))external.push({date,priceYen:priceMan*10000,source})}}}catch(error){if(!String(error.message).startsWith('404'))console.warn('history read failed',error)}return mergePoints(embedded,external)}
async function showDetail(record){selectedId=record.listing_id||record.id;renderListings();$('detail').classList.add('loading');$('detail').innerHTML='<div class="empty">価格履歴を読み込んでいます。</div>';const points=await historyPoints(record);const dates=new Set(points.map(point=>point.date));const rows=points.length?points.map(point=>`<tr><td>${esc(point.date)}</td><td>${money(point.priceYen)}</td><td>${esc(sourceName(point.source))}</td></tr>`).join(''):'<tr><td colspan="3">履歴はまだありません。</td></tr>';$('detail').classList.remove('loading');$('detail').innerHTML=`<h2>${esc(labelFor(record))}</h2><div class="detail-price">${money(record.price_yen)}</div><div class="muted">${esc(record.address||'')}</div><div class="kv"><div>種別</div><div>${propertyType(record)==='land'?'土地':'中古戸建'}</div><div>土地面積</div><div>${area(record.land_area_sqm)}</div><div>建物面積</div><div>${area(record.building_area_sqm)}</div><div>間取り</div><div>${esc(record.layout||'—')}</div><div>築年月</div><div>${esc(record.built_year_month||'—')}</div><div>交通</div><div>${esc(record.access||'—')}</div><div>土地権利</div><div>所有権（確認済み）</div><div>ソース</div><div>${esc(sourceName(record.source))}</div><div>listing_id</div><div><code>${esc(selectedId)}</code></div></div><section class="chart-card"><div class="chart-head"><div><strong>掲載価格の推移</strong><div class="muted" style="font-size:11px;margin-top:2px">同一日・同一ソースにつき1点</div></div><div class="chart-meta">${dates.size}日分・${points.length}点<br>${points.length>=2?'点を線で接続':'2点目から線を表示'}</div></div>${chartMarkup(points)}</section><div class="history-wrap"><table class="history"><thead><tr><th>日付</th><th>価格</th><th>ソース</th></tr></thead><tbody>${rows}</tbody></table></div><a class="open" href="${esc(record.url)}" target="_blank" rel="noopener">掲載ページを開く</a>`}
['q','ward','source','type','max','sort'].forEach(id=>$(id).addEventListener(id==='q'?'input':'change',apply));
load();setInterval(load,15*60*1000);
</script>
