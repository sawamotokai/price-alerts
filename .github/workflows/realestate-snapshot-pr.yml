name: Real-estate snapshot on demand

on:
  pull_request:
    branches: [master]
    paths:
      - 'realestate/run-now.txt'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: realestate-snapshot-pr-${{ github.event.pull_request.number || github.run_id }}
  cancel-in-progress: false

jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref || github.ref_name }}

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'
          cache-dependency-path: realestate/requirements.txt

      - name: Install collector dependencies
        run: python -m pip install -r realestate/requirements.txt

      - name: Decode collector
        run: base64 --decode realestate/collector.py.gz.b64 | gzip --decompress > realestate/collector.py

      - name: Capture snapshot
        env:
          REAL_ESTATE_REQUEST_DELAY: '1.2'
          REAL_ESTATE_MAX_PAGES: '30'
          REAL_ESTATE_MAX_MISSING_RUNS: '2'
        run: python realestate/collector.py

      - name: Commit snapshot to PR branch
        run: |
          rm -f realestate/collector.py
          git config user.name 'realestate-price-watch[bot]'
          git config user.email 'realestate-price-watch[bot]@users.noreply.github.com'
          git add realestate/data
          if git diff --cached --quiet; then
            echo 'No data changes'
          else
            git commit -m 'Capture initial real-estate snapshot'
            git push origin HEAD:${{ github.head_ref }}
          fi
