name: Real-estate nightly collector

on:
  push:
    branches: [master]
    paths:
      - '.github/workflows/realestate-collector.yml'
      - 'realestate/collector_parts/**'
      - 'realestate/adcast_collector.py'
      - 'realestate/enforce_freehold_v2.py'
      - 'realestate/run_strict_freehold.py'
      - 'realestate/validate_price_changes.py'
      - 'realestate/canonicalize_listing_urls.py'
      - 'realestate/strict_export.py'
      - 'realestate/patch_dashboard_ui.py'
      - 'realestate/patch_v1_history.py'
      - 'realestate/patch_market_range_click.py'
      - 'realestate/patch_auth_favorites.py'
      - 'realestate/patch_auth_account_isolation.py'
      - 'realestate/patch_resilient_data_loading.py'
      - 'realestate/requirements.txt'
      - 'realestate/imports/fudousan_japan.json'
  workflow_dispatch:
  schedule:
    - cron: '15 10 * * *' # 19:15 Asia/Tokyo

permissions:
  contents: write

concurrency:
  group: realestate-nightly-collector
  cancel-in-progress: true

jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 55
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: realestate/requirements.txt

      - name: Install collector dependencies
        run: python -m pip install -r realestate/requirements.txt

      - name: Decode collector
        run: cat realestate/collector_parts/part*.b64 | base64 --decode | gzip --decompress > realestate/collector.py

      - name: Collect SUUMO and HOME'S current listings
        env:
          REAL_ESTATE_REQUEST_DELAY: '1.2'
          REAL_ESTATE_MAX_PAGES: '30'
          REAL_ESTATE_MAX_MISSING_RUNS: '2'
        run: python realestate/collector.py

      - name: Collect public ADCAST land listings
        env:
          ADCAST_REQUEST_DELAY: '1.5'
          ADCAST_MAX_PAGES: '20'
          ADCAST_TIMEOUT: '25'
        run: python realestate/adcast_collector.py

      - name: Verify land rights and publish freehold-only dashboard
        env:
          REAL_ESTATE_STRICT_FREEHOLD: '1'
          REAL_ESTATE_RIGHTS_WORKERS: '4'
          REAL_ESTATE_RIGHTS_TIMEOUT: '25'
          REAL_ESTATE_RIGHTS_CACHE_DAYS: '30'
          REAL_ESTATE_RIGHTS_UNKNOWN_RETRY_DAYS: '0'
        run: python realestate/run_strict_freehold.py

      - name: Quarantine unconfirmed extreme price changes
        env:
          REAL_ESTATE_MAX_UNCONFIRMED_PRICE_CHANGE_PCT: '0.35'
          REAL_ESTATE_MIN_PRICE_REGIME_OBSERVATIONS: '2'
        run: python realestate/validate_price_changes.py

      - name: Export normalized verified snapshot for ingest
        run: python realestate/strict_export.py

      - name: Canonicalize outbound listing links
        run: python realestate/canonicalize_listing_urls.py

      - name: Validate source coverage and real verified records
        run: |
          python - <<'PY'
          import json
          import re
          from collections import Counter
          from pathlib import Path

          snapshot = json.loads(Path('realestate/imports/latest.json').read_text(encoding='utf-8'))
          expected = {'SUUMO', "HOME'S", 'fudousan.or.jp', 'ADCAST'}
          coverage = snapshot.get('coverage') or {}
          if set(coverage) != expected:
              raise SystemExit(f'coverage keys mismatch: {sorted(coverage)}')

          suumo_url = re.compile(r'^https://suumo\.jp/chukoikkodate/tokyo/sc_(?:shinagawa|meguro)/nc_\d+/$')
          items = snapshot.get('items') or []
          for item in items:
              if not item.get('source') or not item.get('url'):
                  raise SystemExit(f'invalid non-record item: {item!r}')
              if item.get('land_right_status') != 'freehold' or item.get('land_right') != '所有権':
                  raise SystemExit(f'unverified land right leaked into snapshot: {item!r}')
              if item.get('source') == 'SUUMO' and not suumo_url.fullmatch(str(item.get('url'))):
                  raise SystemExit(f'non-canonical SUUMO detail URL: {item!r}')

          counts = Counter(item['source'] for item in items)
          for source, complete in coverage.items():
              if complete and source != 'fudousan.or.jp' and counts[source] == 0:
                  raise SystemExit(f'{source} says complete but exported zero verified records')

          anomalies = json.loads(Path('realestate/data/price_history_anomalies.json').read_text(encoding='utf-8'))
          print({
              'coverage': coverage,
              'counts': dict(counts),
              'total': len(items),
              'quarantined_price_records': anomalies.get('records_with_quarantined_points'),
          })
          PY

      - name: Keep dashboard UI patched and validated
        run: |
          python realestate/patch_dashboard_ui.py
          if grep -Eq "const CURRENT_URL=|DATA_LOADING_VERSION=2" realestate/dashboard/index.html; then
            echo 'Validated-history loader is already present; preserving the current authenticated loader'
          else
            python realestate/patch_v1_history.py
          fi
          python realestate/patch_market_range_click.py
          python realestate/patch_auth_favorites.py
          python realestate/patch_auth_account_isolation.py
          python realestate/patch_resilient_data_loading.py
          python - <<'PY'
          from pathlib import Path
          import re

          html = Path('realestate/dashboard/index.html').read_text(encoding='utf-8')
          required = [
              'DATA_LOADING_VERSION=2',
              'const DATA_URLS=',
              'const CURRENT_URLS=',
              'function fetchJsonCandidate(',
              'function fetchJsonFromMirrors(',
              "authPromise=initAuth()",
              'id="marketMinPrice"',
              'id="marketMaxPrice"',
              'id="marketPriceReset"',
              'function nearestMarketPoint(',
              "addEventListener('click',openMarketPoint)",
              'id="googleSignIn"',
              'id="signOut"',
              'id="marketFavoritesOnly"',
              "GUEST_FAVORITES_KEY='realestate_guest_favorites_v2'",
              "LEGACY_FAVORITES_KEY='realestate_guest_favorites_v1'",
              'AUTH_FAVORITES_VERSION=2',
              "queryParams:{prompt:'select_account'}",
              'function importLegacyFavorites()',
              'function applySession(session,options={})',
              "from('listing_favorites')",
              'nswgzzvgmudtftvjogvt.supabase.co',
              'await authPromise;populateSources();',
          ]
          missing = [marker for marker in required if marker not in html]
          if missing:
              raise SystemExit(f'missing dashboard interaction markers: {missing}')

          scripts = re.findall(r'<script(?:\s[^>]*)?>(.*?)</script>', html, flags=re.S)
          scripts = [script for script in scripts if script.strip()]
          if not scripts:
              raise SystemExit('no inline dashboard script found')
          Path('/tmp/realestate-dashboard.js').write_text('\n'.join(scripts), encoding='utf-8')
          PY
          node --check /tmp/realestate-dashboard.js

      - name: Publish generated snapshot without rebase conflicts
        shell: bash
        run: |
          set -euo pipefail
          rm -f realestate/collector.py

          snapshot_dir="$(mktemp -d)"
          trap 'rm -rf "$snapshot_dir"' EXIT

          cp -a realestate/data "$snapshot_dir/data"
          cp realestate/imports/latest.json "$snapshot_dir/latest.json"
          cp realestate/dashboard/index.html "$snapshot_dir/index.html"

          git config user.name 'realestate-price-watch[bot]'
          git config user.email 'realestate-price-watch[bot]@users.noreply.github.com'

          for attempt in 1 2 3; do
            echo "Publish attempt ${attempt}/3"
            git fetch origin master
            git reset --hard origin/master

            rm -rf realestate/data
            cp -a "$snapshot_dir/data" realestate/data
            install -D "$snapshot_dir/latest.json" realestate/imports/latest.json
            install -D "$snapshot_dir/index.html" realestate/dashboard/index.html

            git add realestate/data realestate/imports/latest.json realestate/dashboard/index.html
            if git diff --cached --quiet; then
              echo 'No generated data changes'
              exit 0
            fi

            git commit -m 'Capture verified multi-source real-estate snapshot'
            if git push origin HEAD:master; then
              echo 'Snapshot published successfully'
              exit 0
            fi

            echo 'Master moved during publish; retrying from the new tip'
            sleep $((attempt * 2))
          done

          echo 'Failed to publish snapshot after 3 attempts' >&2
          exit 1

# Automation kick: 2026-08-14 resilient data loading
