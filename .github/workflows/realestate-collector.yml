name: Real-estate nightly collector

on:
  push:
    branches: [master]
    paths:
      - '.github/workflows/realestate-collector.yml'
      - 'realestate/collector.py.gz.b64'
      - 'realestate/requirements.txt'
      - 'realestate/imports/fudousan_japan.json'
  workflow_dispatch:
  schedule:
    - cron: '15 10 * * *' # 19:15 Asia/Tokyo

permissions:
  contents: write

concurrency:
  group: realestate-nightly-collector
  cancel-in-progress: false

jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'
          cache-dependency-path: realestate/requirements.txt

      - name: Install collector dependencies
        run: python -m pip install -r realestate/requirements.txt

      - name: Decode collector
        run: base64 --decode realestate/collector.py.gz.b64 | gzip --decompress > realestate/collector.py

      - name: Collect current listings and append first/daily price points
        env:
          REAL_ESTATE_REQUEST_DELAY: '1.2'
          REAL_ESTATE_MAX_PAGES: '30'
          REAL_ESTATE_MAX_MISSING_RUNS: '2'
        run: python realestate/collector.py

      - name: Commit durable snapshot and history
        run: |
          rm -f realestate/collector.py
          git config user.name 'realestate-price-watch[bot]'
          git config user.email 'realestate-price-watch[bot]@users.noreply.github.com'
          git add realestate/data
          if git diff --cached --quiet; then
            echo 'No data changes'
          else
            git commit -m 'Capture real-estate price snapshot'
            git push
          fi
