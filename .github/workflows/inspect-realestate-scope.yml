name: Inspect real-estate collector scope

on:
  workflow_dispatch:
  push:
    branches: [master]
    paths:
      - '.github/workflows/inspect-realestate-scope.yml'

permissions:
  contents: read

jobs:
  inspect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Decode and inspect scope
        shell: bash
        run: |
          cat realestate/collector_parts/part*.b64 | base64 --decode | gzip --decompress > /tmp/collector.py
          echo '=== collector scope ==='
          grep -nE 'shinagawa|meguro|品川区|目黒区|chukoikkodate|tochi|homes|WARD|ward' /tmp/collector.py | head -220 || true
          echo '=== ADCAST scope ==='
          grep -nE 'shinagawa|meguro|品川区|目黒区|city_cd|ward' realestate/adcast_collector.py | head -160 || true
          echo '=== freehold scope ==='
          grep -nE 'TARGET_WARDS|sc_shinagawa|sc_meguro' realestate/enforce_freehold_v2.py || true
