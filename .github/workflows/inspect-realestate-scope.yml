name: Inspect real-estate collector scope

on:
  workflow_dispatch:
  push:
    branches: [master]
    paths:
      - '.github/workflows/inspect-realestate-scope.yml'

permissions:
  contents: read

jobs:
  inspect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Decode and inspect scope
        shell: bash
        run: |
          cat realestate/collector_parts/part*.b64 | base64 --decode | gzip --decompress > /tmp/collector.py
          echo '=== collector config ==='
          sed -n '50,90p' /tmp/collector.py
          echo '=== collector parser ==='
          sed -n '330,485p' /tmp/collector.py
          echo '=== ADCAST scope ==='
          sed -n '20,45p' realestate/adcast_collector.py
          echo '=== freehold scope ==='
          grep -nE 'TARGET_WARDS|sc_shinagawa|sc_meguro' realestate/enforce_freehold_v2.py || true
