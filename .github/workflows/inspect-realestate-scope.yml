name: Inspect real-estate collector scope

on:
  workflow_dispatch:
  push:
    branches: [master]
    paths:
      - '.github/workflows/inspect-realestate-scope.yml'

permissions:
  contents: read

jobs:
  inspect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Decode and inspect scope
        shell: bash
        run: |
          cat realestate/collector_parts/part*.b64 | base64 --decode | gzip --decompress > /tmp/collector.py
          echo '=== URL helpers ==='
          grep -nE '^def canonical_url|^def navigation_url|urljoin|listing_pattern' /tmp/collector.py || true
          echo '=== canonical_url body ==='
          line=$(grep -n '^def canonical_url' /tmp/collector.py | head -1 | cut -d: -f1 || true)
          if [ -n "$line" ]; then sed -n "${line},$((line+55))p" /tmp/collector.py; fi
          echo '=== parse listing URL area ==='
          sed -n '430,460p' /tmp/collector.py
