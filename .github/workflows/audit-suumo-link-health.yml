name: Audit SUUMO link health

on:
  workflow_dispatch:
  push:
    branches: [master]
    paths:
      - '.github/workflows/audit-suumo-link-health.yml'

permissions:
  contents: write

jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install requests
      - name: Audit current SUUMO links and target
        shell: bash
        run: |
          python - <<'PY'
          import json, random, requests, time
          from pathlib import Path
          from collections import defaultdict

          rows=json.loads(Path('realestate/imports/latest.json').read_text())['items']
          suumo=[r for r in rows if r.get('source')=='SUUMO']
          by=defaultdict(list)
          for r in suumo: by[r.get('ward')].append(r)
          target='https://suumo.jp/chukoikkodate/tokyo/sc_meguro/nc_20926853/'
          session=requests.Session(); session.headers['User-Agent']='Mozilla/5.0'
          def check(url):
              try:
                  resp=session.get(url,timeout=15,allow_redirects=True)
                  text=resp.text[:250000]
                  dead=('お探しのページは見つかりません' in text or '掲載終了' in text or '物件が見つかりません' in text)
                  return {'status':resp.status_code,'final_url':resp.url,'dead_marker':dead,'bytes':len(resp.content)}
              except Exception as e:
                  return {'status':'ERR','error':type(e).__name__+':'+str(e)}
          report={'target':{'url':target,'plain':check(target),'tenpo':check(target.rstrip('/')+'/tenpo/')},'wards':{}}
          random.seed(42)
          for ward,items in sorted(by.items()):
              sample=items[:15] + random.sample(items,min(15,len(items)))
              seen=set(); sample=[x for x in sample if not (x['url'] in seen or seen.add(x['url']))]
              results=[]
              for r in sample:
                  result=check(r['url']); results.append({'url':r['url'],'title':r.get('title'),'result':result}); time.sleep(.1)
              ok=sum(x['result'].get('status')==200 and not x['result'].get('dead_marker') for x in results)
              dead=sum(x['result'].get('status') in (404,410) or x['result'].get('dead_marker') for x in results)
              report['wards'][ward]={'total_current':len(items),'sample_size':len(results),'ok':ok,'dead':dead,'other':len(results)-ok-dead,'results':results}
          out=Path('realestate/data/suumo_link_audit.json'); out.parent.mkdir(parents=True,exist_ok=True); out.write_text(json.dumps(report,ensure_ascii=False,indent=2)+'\n')
          print(json.dumps({k:{kk:v for kk,v in val.items() if kk!='results'} for k,val in report['wards'].items()},ensure_ascii=False))
          print('target',report['target'])
          PY
      - name: Commit audit report
        run: |
          git config user.name 'suumo-link-audit[bot]'
          git config user.email 'suumo-link-audit[bot]@users.noreply.github.com'
          git add realestate/data/suumo_link_audit.json
          git diff --cached --quiet && exit 0
          git commit -m 'Audit current SUUMO link health'
          git push
