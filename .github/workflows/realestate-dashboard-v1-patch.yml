name: Restore v1 real-estate dashboard UI

on:
  push:
    branches: [master]
    paths:
      - '.github/workflows/realestate-dashboard-v1-patch.yml'
      - 'realestate/patch_v1_history.py'
      - 'realestate/dashboard/index.html'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: realestate-dashboard-v1-patch
  cancel-in-progress: true

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: master
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Preserve v1 UI and merge durable histories
        run: python realestate/patch_v1_history.py
      - name: Validate v1 features and JavaScript syntax
        run: |
          python - <<'PY'
          from pathlib import Path
          import re

          path = Path('realestate/dashboard/index.html')
          text = path.read_text(encoding='utf-8')
          required = [
              '全物件の掲載価格推移',
              'id="marketCanvas"',
              'function drawMarketChart(scope)',
              "const CURRENT_URL=",
              'function drawDetail(h)',
              'function listingUrl(x)',
              'https://suumo.jp/chukoikkodate/tokyo/sc_${scope}/nc_${id}/',
          ]
          missing = [value for value in required if value not in text]
          if missing:
              raise SystemExit(f'missing v1 dashboard features: {missing}')
          scripts = re.findall(r'<script[^>]*>(.*?)</script>', text, re.S | re.I)
          if not scripts:
              raise SystemExit('dashboard script not found')
          Path('/tmp/dashboard.js').write_text('\n'.join(scripts), encoding='utf-8')
          print('v1 dashboard appearance and canonical SUUMO links preserved')
          PY
          node --check /tmp/dashboard.js
      - name: Commit patched v1 dashboard
        run: |
          git config user.name 'realestate-price-watch[bot]'
          git config user.email 'realestate-price-watch[bot]@users.noreply.github.com'
          git add realestate/dashboard/index.html
          if git diff --cached --quiet; then
            echo 'No v1 dashboard changes'
          else
            git commit -m 'Hydrate v1 all-property and detail price charts'
            git pull --rebase origin master
            git push origin HEAD:master
          fi
