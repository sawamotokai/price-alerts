name: Real-estate dashboard browser smoke test

on:
  push:
    branches: [master]
    paths:
      - 'realestate/dashboard/index.html'
      - 'realestate/patch_resilient_data_loading.py'
      - 'realestate/patch_market_point_dots.py'
      - '.github/workflows/realestate-dashboard-smoke.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: realestate-dashboard-smoke
  cancel-in-progress: true

jobs:
  smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install browser test dependency
        run: |
          npm --silent --no-save install playwright
          npx playwright install chromium

      - name: Start static dashboard server
        run: |
          python3 -m http.server 8000 --directory realestate/dashboard >/tmp/dashboard-server.log 2>&1 &
          echo $! >/tmp/dashboard-server.pid
          for i in {1..20}; do
            curl -fsS http://127.0.0.1:8000/ >/dev/null && exit 0
            sleep 0.5
          done
          cat /tmp/dashboard-server.log
          exit 1

      - name: Verify listings and visible chart point dots
        run: |
          cat >dashboard-smoke.mjs <<'JS'
          import { chromium } from 'playwright';

          const browser = await chromium.launch({ headless: true });
          const page = await browser.newPage({ viewport: { width: 1280, height: 900 } });
          const errors = [];
          page.on('pageerror', error => errors.push(`pageerror: ${error.message}`));
          page.on('requestfailed', request => errors.push(`requestfailed: ${request.url()} ${request.failure()?.errorText || ''}`));
          page.on('console', message => {
            if (['error', 'warning'].includes(message.type())) errors.push(`${message.type()}: ${message.text()}`);
          });

          await page.goto('http://127.0.0.1:8000/', { waitUntil: 'domcontentloaded', timeout: 30000 });
          let waitError = null;
          try {
            await page.waitForFunction(() => {
              const text = document.querySelector('#status')?.textContent || '';
              return text && !text.includes('読み込んでいます') && !text.includes('読込中');
            }, null, { timeout: 40000 });
          } catch (error) {
            waitError = error.message;
          }

          const diagnostics = await page.evaluate(() => {
            let pointDot = null;
            try {
              const canvas = document.querySelector('#marketCanvas');
              const series = marketGeometry?.find(s => s?.geom?.length);
              const point = series?.geom?.[0];
              if (canvas && point) {
                const ctx = canvas.getContext('2d');
                const sx = canvas.width / (canvas.clientWidth || canvas.width);
                const sy = canvas.height / (canvas.clientHeight || canvas.height);
                const cx = Math.round(point.px * sx);
                const cy = Math.round(point.py * sy);
                const radius = Math.max(6, Math.round(7 * Math.max(sx, sy)));
                const x = Math.max(0, cx - radius);
                const y = Math.max(0, cy - radius);
                const w = Math.min(canvas.width - x, radius * 2 + 1);
                const h = Math.min(canvas.height - y, radius * 2 + 1);
                const pixels = ctx.getImageData(x, y, w, h).data;
                let colored = 0;
                for (let i = 0; i < pixels.length; i += 4) {
                  const [r,g,b,a] = [pixels[i], pixels[i+1], pixels[i+2], pixels[i+3]];
                  if (a > 40 && !(r > 235 && g > 235 && b > 235)) colored++;
                }
                pointDot = { cx, cy, radius, colored, version: typeof MARKET_POINT_DOTS_VERSION !== 'undefined' ? MARKET_POINT_DOTS_VERSION : null };
              }
            } catch (error) {
              pointDot = { error: String(error) };
            }
            return {
              readyState: document.readyState,
              status: document.querySelector('#status')?.textContent || null,
              total: document.querySelector('#metricTotal')?.textContent || null,
              shown: document.querySelector('#metricShown')?.textContent || null,
              hasRender: typeof render === 'function',
              hasMarketChart: typeof drawMarketChart === 'function',
              dataInitialized: typeof dataInitialized !== 'undefined' ? dataInitialized : null,
              geometrySeries: typeof marketGeometry !== 'undefined' ? marketGeometry.length : 0,
              pointDot,
            };
          });
          diagnostics.waitError = waitError;
          diagnostics.errors = errors;
          console.log(JSON.stringify(diagnostics, null, 2));
          await page.screenshot({ path: '/tmp/dashboard-smoke.png', fullPage: true });

          if (waitError) throw new Error(`dashboard stayed loading: ${waitError}`);
          if ((diagnostics.status || '').includes('失敗')) throw new Error(diagnostics.status);
          if (!/\d/.test(diagnostics.total || '') || diagnostics.total === '0') throw new Error(`invalid listing total: ${diagnostics.total}`);
          if (!diagnostics.hasRender || !diagnostics.hasMarketChart) throw new Error('base dashboard functions are missing');
          if (!diagnostics.dataInitialized) throw new Error('data did not initialize');
          if (!diagnostics.geometrySeries) throw new Error('market chart geometry is empty');
          if (diagnostics.pointDot?.version !== 2) throw new Error(`wrong point-dot renderer: ${JSON.stringify(diagnostics.pointDot)}`);
          if ((diagnostics.pointDot?.colored || 0) < 25) throw new Error(`point dot is not visibly painted: ${JSON.stringify(diagnostics.pointDot)}`);
          if (errors.some(line => line.startsWith('pageerror:'))) throw new Error(errors.join('\n'));

          await browser.close();
          JS
          node dashboard-smoke.mjs
