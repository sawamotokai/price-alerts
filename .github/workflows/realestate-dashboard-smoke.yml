name: Real-estate dashboard browser smoke test

on:
  push:
    branches: [master]
    paths:
      - 'realestate/dashboard/index.html'
      - 'realestate/patch_resilient_data_loading.py'
      - '.github/workflows/realestate-dashboard-smoke.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: realestate-dashboard-smoke
  cancel-in-progress: true

jobs:
  smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install browser test dependency
        run: |
          npm --silent --no-save install playwright
          npx playwright install chromium

      - name: Start static dashboard server
        run: |
          python3 -m http.server 8000 --directory realestate/dashboard >/tmp/dashboard-server.log 2>&1 &
          echo $! >/tmp/dashboard-server.pid
          for i in {1..20}; do
            curl -fsS http://127.0.0.1:8000/ >/dev/null && exit 0
            sleep 0.5
          done
          cat /tmp/dashboard-server.log
          exit 1

      - name: Verify listings render instead of loading forever
        run: |
          cat >dashboard-smoke.mjs <<'JS'
          import { chromium } from 'playwright';

          const browser = await chromium.launch({ headless: true });
          const page = await browser.newPage({ viewport: { width: 1280, height: 900 } });
          const errors = [];
          page.on('pageerror', error => errors.push(`pageerror: ${error.message}`));
          page.on('requestfailed', request => errors.push(`requestfailed: ${request.url()} ${request.failure()?.errorText || ''}`));
          page.on('console', message => {
            if (['error', 'warning'].includes(message.type())) errors.push(`${message.type()}: ${message.text()}`);
          });

          await page.goto('http://127.0.0.1:8000/', { waitUntil: 'domcontentloaded', timeout: 30000 });
          let waitError = null;
          try {
            await page.waitForFunction(() => {
              const text = document.querySelector('#status')?.textContent || '';
              return text && !text.includes('読み込んでいます') && !text.includes('読込中');
            }, null, { timeout: 40000 });
          } catch (error) {
            waitError = error.message;
          }

          const diagnostics = await page.evaluate(() => ({
            readyState: document.readyState,
            status: document.querySelector('#status')?.textContent || null,
            total: document.querySelector('#metricTotal')?.textContent || null,
            shown: document.querySelector('#metricShown')?.textContent || null,
            authMessage: document.querySelector('#authMessage')?.textContent || null,
            hasDataVersion: typeof DATA_LOADING_VERSION !== 'undefined',
            hasFetchMirrors: typeof fetchJsonFromMirrors === 'function',
            hasInitAuth: typeof initAuth === 'function',
            hasRender: typeof render === 'function',
            hasMarketChart: typeof drawMarketChart === 'function',
            hasSupabase: Boolean(window.supabase),
            resources: performance.getEntriesByType('resource').map(entry => ({
              name: entry.name,
              duration: Math.round(entry.duration),
              transferSize: entry.transferSize,
            })).slice(-20),
          }));
          diagnostics.waitError = waitError;
          diagnostics.errors = errors;
          console.log(JSON.stringify(diagnostics, null, 2));
          await page.screenshot({ path: '/tmp/dashboard-smoke.png', fullPage: true });

          if (waitError) throw new Error(`dashboard stayed loading: ${waitError}`);
          if ((diagnostics.status || '').includes('失敗')) throw new Error(diagnostics.status);
          if (!/\d/.test(diagnostics.total || '') || diagnostics.total === '0') throw new Error(`invalid listing total: ${diagnostics.total}`);
          if (!/\d/.test(diagnostics.shown || '')) throw new Error(`invalid shown count: ${diagnostics.shown}`);
          if (!diagnostics.hasRender || !diagnostics.hasMarketChart) throw new Error('base dashboard functions are missing');
          if (errors.some(line => line.startsWith('pageerror:'))) throw new Error(errors.join('\n'));

          await browser.close();
          JS
          node dashboard-smoke.mjs

# Verification target: repaired dashboard with restored render functions
