name: Real-estate dashboard UI patch

on:
  push:
    branches: [master]
    paths:
      - 'realestate/patch_dashboard_ui.py'
      - '.github/workflows/dashboard-ui-patch.yml'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: realestate-dashboard-ui-patch
  cancel-in-progress: true

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Patch dashboard UI
        run: python realestate/patch_dashboard_ui.py

      - name: Commit patched dashboard
        run: |
          git config user.name 'realestate-price-watch[bot]'
          git config user.email 'realestate-price-watch[bot]@users.noreply.github.com'
          git add realestate/dashboard/index.html
          if git diff --cached --quiet; then
            echo 'Dashboard UI already patched'
          else
            git commit -m 'Feature price drops and exclude leasehold listings'
            git pull --rebase origin master
            git push origin HEAD:master
          fi
