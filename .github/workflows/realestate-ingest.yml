name: Real-estate snapshot ingest

on:
  push:
    branches: [master]
    paths:
      - '.github/workflows/realestate-ingest.yml'
      - 'realestate/ingest_snapshot.py'
      - 'realestate/repair_daily_history.py'
      - 'realestate/imports/latest.json'
  workflow_run:
    workflows: ['Real-estate nightly collector']
    types: [completed]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: realestate-snapshot-ingest
  cancel-in-progress: true

jobs:
  ingest:
    if: github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: master
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Merge latest snapshot into durable history
        run: python realestate/ingest_snapshot.py
      - name: Repair canonical daily series from append-only ledger
        run: python realestate/repair_daily_history.py
      - name: Validate that multi-day observations form a series
        run: |
          python - <<'PY'
          import json
          from pathlib import Path

          health = json.loads(Path('realestate/data/history_health.json').read_text(encoding='utf-8'))
          count = int(health.get('records_with_two_or_more_daily_points') or 0)
          samples = health.get('samples') or []
          if count <= 0 or not samples:
              raise SystemExit('No repaired multi-day price series were found')
          sample = samples[0]
          if len(sample.get('dates') or []) < 2:
              raise SystemExit(f'Invalid multi-day sample: {sample!r}')
          print({'multi_day_records': count, 'sample': sample})
          PY
      - name: Commit generated current/history data
        run: |
          git config user.name 'realestate-price-watch[bot]'
          git config user.email 'realestate-price-watch[bot]@users.noreply.github.com'
          git add realestate/data
          if git diff --cached --quiet; then
            echo 'No data changes'
          else
            git commit -m 'Update real-estate price history'
            git pull --rebase origin master
            git push origin HEAD:master
          fi
