name: Real-estate snapshot ingest

on:
  push:
    branches: [master]
    paths:
      - '.github/workflows/realestate-ingest.yml'
      - 'realestate/ingest_snapshot.py'
      - 'realestate/repair_daily_history.py'
      - 'realestate/validate_price_changes.py'
      - 'realestate/enforce_quarantined_price_metrics.py'
      - 'realestate/imports/latest.json'
  workflow_run:
    workflows: ['Real-estate nightly collector']
    types: [completed]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: realestate-snapshot-ingest
  cancel-in-progress: true

jobs:
  ingest:
    if: github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: master
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Merge latest snapshot into durable history
        run: python realestate/ingest_snapshot.py
      - name: Repair canonical daily series from append-only ledger
        run: python realestate/repair_daily_history.py
      - name: Quarantine unconfirmed extreme price changes
        env:
          REAL_ESTATE_MAX_UNCONFIRMED_PRICE_CHANGE_PCT: '0.35'
          REAL_ESTATE_MIN_PRICE_REGIME_OBSERVATIONS: '2'
        run: python realestate/validate_price_changes.py
      - name: Keep quarantined price changes out of decision metrics
        run: python realestate/enforce_quarantined_price_metrics.py
      - name: Validate durable and dashboard-safe price series
        run: |
          python - <<'PY'
          import json
          from pathlib import Path

          health = json.loads(Path('realestate/data/history_health.json').read_text(encoding='utf-8'))
          count = int(health.get('records_with_two_or_more_daily_points') or 0)
          samples = health.get('samples') or []
          if count <= 0 or not samples:
              raise SystemExit('No repaired multi-day raw price series were found')
          sample = samples[0]
          if len(sample.get('dates') or []) < 2:
              raise SystemExit(f'Invalid multi-day sample: {sample!r}')

          current = json.loads(Path('realestate/data/current.json').read_text(encoding='utf-8'))
          rows = current.get('listings') or {}
          rows = rows if isinstance(rows, list) else list(rows.values())
          for record in rows:
              validated = record.get('price_history_validated') or []
              status = record.get('price_change_status')
              if status == 'confirmed' and len(validated) < 2:
                  raise SystemExit(f'confirmed price change lacks two points: {record.get("listing_id")}')
              if status and status.startswith('quarantined') and int(record.get('price_change_yen_validated') or 0) != 0:
                  raise SystemExit(f'quarantined change leaked into decision metric: {record.get("listing_id")}')

          # Regression: SUUMO 21387860 has noisy legacy list-card observations
          # mixed into its raw history. Those observations remain auditable, but
          # they must never surface as a confirmed price change or decision metric.
          target = next((r for r in rows if '21387860' in str(r.get('url') or '')), None)
          if target:
              status = str(target.get('price_change_status') or '')
              delta = int(target.get('price_change_yen_validated') or 0)
              if status == 'confirmed' or delta != 0:
                  raise SystemExit(f'false SUUMO 21387860 price drop leaked into metrics: {target!r}')

          print({
              'raw_multi_day_records': count,
              'quarantined_records': (current.get('price_history_validation') or {}).get('records_with_quarantined_points'),
              'regression_target': target.get('listing_id') if target else None,
          })
          PY
      - name: Commit generated current/history data
        run: |
          git config user.name 'realestate-price-watch[bot]'
          git config user.email 'realestate-price-watch[bot]@users.noreply.github.com'
          git add realestate/data
          if git diff --cached --quiet; then
            echo 'No data changes'
          else
            git commit -m 'Update validated real-estate price history'
            git pull --rebase origin master
            git push origin HEAD:master
          fi
